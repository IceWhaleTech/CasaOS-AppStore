name: cantinarr
services:
  cantinarr:
    image: ghcr.io/windoze95/cantinarr:latest
    container_name: cantinarr
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 8585
        published: "8585"
        protocol: tcp
    environment:
      CANTINARR_PUSH_GATEWAY_URL: https://push.cantinarr.com
      CANTINARR_ARR_CALLBACK_URL: ""
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    x-casaos:
      envs:
        - container: CANTINARR_PUSH_GATEWAY_URL
          description:
            en_US: Push gateway for the companion iOS and Android apps. The server enrolls itself on first start with no signup; clear the value to disable push, or point it at your own gateway.
        - container: CANTINARR_ARR_CALLBACK_URL
          description:
            en_US: Origin your Radarr, Sonarr, Chaptarr, and Lidarr containers POST webhooks back to, for example http://192.168.1.10:8585. Leave blank to use whatever address you browse to. This is not the address people reach Cantinarr at; set that in the app under Settings, External Address. Formerly named CANTINARR_PUBLIC_URL, which existing containers can keep using.
      ports:
        - container: "8585"
          description:
            en_US: Web UI and API
      volumes:
        - container: /config
          description:
            en_US: Cantinarr's database and its generated encryption key
x-casaos:
  id: codes.julian.cantinarr
  architectures:
    - amd64
    - arm64
  main: cantinarr
  author: windoze95
  developer: windoze95
  category: Media
  description:
    en_US: >-
      Cantinarr brings media requests and server management into one app. Household members browse and request movies, shows, books, and music, follow downloads, and get notified when content is ready. Admins manage Radarr, Sonarr, Chaptarr, Lidarr, and download clients, review approvals, and investigate stuck downloads from a phone or browser. Connect the services you use after setup. AI is optional: an assistant can help with library questions and requests, while the repair agent investigates persistent download problems and proposes actions for an administrator to review. Cantinarr also offers MCP tools for authorized clients. Service credentials stay server-side and are encrypted at rest.
  tagline:
    en_US: Media requests and server management in one app
  icon: https://raw.githubusercontent.com/windoze95/cantinarr/main/app/web/icons/Icon-512.png
  screenshot_link:
    - https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/04-request.png
    - https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/05-phone-discover.jpg
    - https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/02-issues.png
  thumbnail: https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/01-discover.jpg
  tips:
    before_install:
      en_US: Radarr, Sonarr, Chaptarr, Lidarr, download clients, Tautulli, and Plex are all optional and are added from the admin UI after first run. Push notifications to the companion iPhone and Android apps work out of the box through the preset push gateway; clear CANTINARR_PUSH_GATEWAY_URL to turn them off. If your arr containers cannot reach the address you browse Cantinarr on, set CANTINARR_ARR_CALLBACK_URL to an origin they can dial so instant updates work.
  title:
    en_US: Cantinarr
  index: /
  port_map: "8585"
  version: "0.15.0"
  update_at: "2026-09-23"
  website: "https://cantinarr.com"
  repo: "https://github.com/windoze95/cantinarr"
  support: "https://github.com/windoze95/cantinarr/issues"
  docs: "https://github.com/windoze95/cantinarr#readme"
