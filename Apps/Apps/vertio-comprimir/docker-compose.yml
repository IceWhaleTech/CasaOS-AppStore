 name: vertio-comprimir
    services:
      vertio-comprimir:
        image: kyouz2148/vertio-comprimir:latest
        container_name: vertio-comprimir
        restart: unless-stopped
        ports:
          - "8088:8088"
        environment:
          - PYTHONUNBUFFERED=1
        x-casaos:
          ports:
            - container: "8088"
              description:
                en_US: Web UI Port
          envs:
            - container: PYTHONUNBUFFERED
              description:
                en_US: Python stdout buffering
    
    x-casaos:
      architectures:
        - amd64
        - arm64
        - arm
      main: vertio-comprimir
      author: Vertio
      category: Utilities
      description:
        en_US: Fast and private image and PDF compressor with target size (KB/MB) and quality controls.
      developer: Vertio
      icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/vertio-
  comprimir/icon.svg
      tagline:
        en_US: Fast and private image and file compressor
      title:
        en_US: Vertio Comprimir
      port_map: "8088"
      index: /
      scheme: http
