name: ai-marketplace-monitor
services:
  ai-marketplace-monitor:
    image: ghcr.io/bopeng/ai-marketplace-monitor:0.10.14
    container_name: ai-marketplace-monitor
    deploy:
      resources:
        reservations:
          memory: 512M
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FACEBOOK_USERNAME: ""
      FACEBOOK_PASSWORD: ""
      UNITYSVC_API_KEY: "svcpass_XXXXX"
    network_mode: bridge
    ports:
      - target: 8467
        published: "8467"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    x-casaos:
      envs:
        - container: FACEBOOK_USERNAME
          description:
            en_US: The Facebook account aimm logs in with. Also signs you in to the web UI.
        - container: FACEBOOK_PASSWORD
          description:
            en_US: Password of that Facebook account. Also signs you in to the web UI.
        - container: UNITYSVC_API_KEY
          description:
            en_US: For the default configuration, a UnitySVC API key (https://unitysvc.com) for the AI that rates listings and for email and phone notifications. Replace the placeholder with your key; with the placeholder, aimm searches but cannot rate listings or send notifications until you set a key here or other AI and notification services in the web UI.
        - container: PUID
          description:
            en_US: User ID that owns the files in the data folder
        - container: PGID
          description:
            en_US: Group ID that owns the files in the data folder
        - container: TZ
          description:
            en_US: Time zone, for the daily digest
      ports:
        - container: "8467"
          description:
            en_US: Web UI port
      volumes:
        - container: /data
          description:
            en_US: config.toml, the cache and the logs

x-casaos:
  id: io.github.bopeng.ai-marketplace-monitor
  version: "0.10.14"
  architectures:
    - amd64
    - arm64
  main: ai-marketplace-monitor
  author: BoPeng
  developer: BoPeng
  category: AI
  description:
    en_US: |
      AI Marketplace Monitor (aimm) watches Facebook Marketplace for the items you want, rates each new listing with AI, and notifies you of good deals by email, phone, Discord, Slack, Telegram and more.

      aimm logs in to Facebook in its own browser. If Facebook asks for a CAPTCHA or a security code, click Open browser in the web UI and complete it there. Describe what you are looking for in the Configure chat, or edit config.toml in the web UI.

      The default configuration uses one UnitySVC API key (https://unitysvc.com) both for the AI that rates listings (OpenAI, Anthropic and other engines) and for email and phone notifications. You can configure other providers instead.
  tagline:
    en_US: Find Facebook Marketplace deals with AI
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/AIMarketplaceMonitor/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/AIMarketplaceMonitor/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/AIMarketplaceMonitor/screenshot-1.png
  tips:
    before_install:
      en_US: |
        Before installing, set FACEBOOK_USERNAME and FACEBOOK_PASSWORD in the installation settings (and replace the UNITYSVC_API_KEY placeholder with your key, for the default configuration). If they are empty, the web UI will not start; edit the installed app's settings and restart it. The web UI asks for the same Facebook username and password.
  title:
    en_US: AI Marketplace Monitor
  index: /
  port_map: "8467"
  scheme: http
  update_at: "2026-10-10"
  release_notes:
    en_US: |-
      - The search radius now takes effect: aimm sets it in Facebook Marketplace's location settings, since Facebook ignores it in the search URL.
      - The Configure chat finds the search location from a city or ZIP code, and Settings › About has a Check for updates button.
  website: https://github.com/BoPeng/ai-marketplace-monitor
  repo: https://github.com/BoPeng/ai-marketplace-monitor
  support: https://github.com/BoPeng/ai-marketplace-monitor/issues
  docs: https://ai-marketplace-monitor.readthedocs.io
