  description:
    en_US: Frigate is an open-source network video recorder (NVR) with real-time AI object detection. It provides local, private camera recording, event review, snapshots, and live viewing through a web interface.
    zh_CN: Frigate 是一款开源网络录像机（NVR），支持实时 AI 目标检测。它提供本地私有的摄像头录像、事件查看、快照和网页实时预览功能。
    de_DE: Frigate ist ein quelloffener Netzwerk-Videorekorder (NVR) mit Echtzeit-KI-Objekterkennung für lokale, private Kameraaufnahmen und Live-Ansichten.
    es_ES: Frigate es un grabador de vídeo en red (NVR) de código abierto con detección de objetos mediante IA en tiempo real, grabación local y visualización en directo.
    fr_FR: Frigate est un enregistreur vidéo réseau (NVR) open source avec détection d’objets par IA en temps réel, enregistrement local et visionnage en direct.
    it_IT: Frigate è un videoregistratore di rete (NVR) open source con rilevamento degli oggetti tramite IA in tempo reale, registrazione locale e visualizzazione live.
    ja_JP: Frigate はリアルタイム AI 物体検出に対応したオープンソースのネットワークビデオレコーダー（NVR）です。ローカル録画とライブ表示を提供します。
    ko_KR: Frigate는 실시간 AI 객체 감지를 지원하는 오픈 소스 네트워크 비디오 레코더(NVR)로, 로컬 녹화와 라이브 보기를 제공합니다.
    pt_BR: Frigate é um gravador de vídeo em rede (NVR) de código aberto com detecção de objetos por IA em tempo real, gravação local e visualização ao vivo.
    ru_RU: Frigate — это сетевой видеорегистратор (NVR) с открытым исходным кодом и обнаружением объектов с помощью ИИ в реальном времени, локальной записью и просмотром вживую.
