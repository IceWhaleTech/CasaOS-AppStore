  release_notes:
    en_US: |-
      - Frigate 0.17.2 is a maintenance release with security and stability fixes.
      - Fixes a go2rtc command-prefix bypass that could lead to remote code execution and container escape (CVE-2026-25643).
      - Fixes an admin response cache leak and incorrect cache-control headers for current-hour preview MP4 files.
    zh_CN: |-
      - Frigate 0.17.2 是一个包含安全性和稳定性修复的维护版本。
      - 修复 go2rtc 命令前缀绕过漏洞，该漏洞可能导致远程代码执行和容器逃逸（CVE-2026-25643）。
      - 修复管理员响应缓存泄漏，以及当前小时预览 MP4 文件的缓存控制标头问题。
    de_DE: |-
      - Frigate 0.17.2 ist eine Wartungsversion mit Sicherheits- und Stabilitätskorrekturen.
      - Behebt eine Umgehung der go2rtc-Befehlspräfixprüfung, die Remote-Codeausführung und Container-Flucht ermöglichen konnte (CVE-2026-25643).
      - Behebt ein Cache-Leck bei Admin-Antworten und fehlerhafte Cache-Control-Header für Vorschau-MP4-Dateien der aktuellen Stunde.
    es_ES: |-
      - Frigate 0.17.2 es una versión de mantenimiento con correcciones de seguridad y estabilidad.
      - Corrige un bypass del prefijo de comandos de go2rtc que podía permitir ejecución remota de código y escape del contenedor (CVE-2026-25643).
      - Corrige una fuga de caché de respuestas de administrador y encabezados Cache-Control incorrectos para MP4 de vista previa de la hora actual.
    fr_FR: |-
      - Frigate 0.17.2 est une version de maintenance avec des correctifs de sécurité et de stabilité.
      - Corrige un contournement du préfixe de commande go2rtc pouvant permettre l’exécution de code à distance et une sortie du conteneur (CVE-2026-25643).
      - Corrige une fuite du cache des réponses administrateur et les en-têtes Cache-Control incorrects des MP4 d’aperçu de l’heure courante.
    it_IT: |-
      - Frigate 0.17.2 è una versione di manutenzione con correzioni di sicurezza e stabilità.
      - Risolve un bypass del prefisso dei comandi go2rtc che poteva consentire l’esecuzione di codice remoto e l’evasione dal container (CVE-2026-25643).
      - Risolve una perdita della cache delle risposte degli amministratori e intestazioni Cache-Control errate per i file MP4 di anteprima dell’ora corrente.
    ja_JP: |-
      - Frigate 0.17.2 はセキュリティと安定性の修正を含むメンテナンスリリースです。
      - リモートコード実行やコンテナ脱出につながる可能性がある go2rtc コマンドプレフィックス回避を修正しました（CVE-2026-25643）。
      - 管理者レスポンスのキャッシュ漏洩と、現在時刻のプレビュー MP4 に対する誤った Cache-Control ヘッダーを修正しました。
    ko_KR: |-
      - Frigate 0.17.2는 보안 및 안정성 수정이 포함된 유지보수 릴리스입니다.
      - 원격 코드 실행과 컨테이너 탈출로 이어질 수 있는 go2rtc 명령 접두사 우회를 수정했습니다(CVE-2026-25643).
      - 관리자 응답 캐시 누수와 현재 시간 미리보기 MP4의 잘못된 Cache-Control 헤더를 수정했습니다.
    pt_BR: |-
      - O Frigate 0.17.2 é uma versão de manutenção com correções de segurança e estabilidade.
      - Corrige um bypass do prefixo de comandos do go2rtc que poderia permitir execução remota de código e escape do contêiner (CVE-2026-25643).
      - Corrige um vazamento de cache de respostas de administradores e cabeçalhos Cache-Control incorretos para MP4 de pré-visualização da hora atual.
    ru_RU: |-
      - Frigate 0.17.2 — это технический выпуск с исправлениями безопасности и стабильности.
      - Исправлен обход префикса команд go2rtc, который мог привести к удалённому выполнению кода и выходу из контейнера (CVE-2026-25643).
      - Исправлена утечка кэша ответов администратора и неверные заголовки Cache-Control для MP4-превью текущего часа.
    ar_SA: |-
      - Frigate 0.17.2 هو إصدار صيانة يتضمن إصلاحات للأمان والاستقرار.
      - تم إصلاح تجاوز بادئة أوامر go2rtc الذي قد يؤدي إلى تنفيذ تعليمات برمجية عن بُعد والهروب من الحاوية (CVE-2026-25643).
      - تم إصلاح تسريب ذاكرة التخزين المؤقت لاستجابات المسؤول وعناوين Cache-Control غير الصحيحة لملفات MP4 للمعاينة الحالية.
