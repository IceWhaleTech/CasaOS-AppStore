# Based on https://docs.gitlab.com/install/docker/installation/#install-gitlab-by-using-docker-compose
name: gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.3-ce.0
    container_name: gitlab
    environment:
      # Required: the address users will open, including the published HTTP port.
      # Example: http://192.168.1.10:8929
      GITLAB_EXTERNAL_URL: ""
      GITLAB_SSH_PORT: "2424"
      GITLAB_OMNIBUS_CONFIG: |
        external_url ENV.fetch('GITLAB_EXTERNAL_URL')
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        letsencrypt['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = Integer(ENV.fetch('GITLAB_SSH_PORT'))
        # Small-instance settings from GitLab's memory-constrained environment guide.
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        puma['exporter_enabled'] = false
        sidekiq['metrics_enabled'] = false
        gitlab_rails['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }
        gitaly['configuration'] = {
          concurrency: [
            { 'rpc' => '/gitaly.SmartHTTPService/PostReceivePack', 'max_per_repo' => 3 },
            { 'rpc' => '/gitaly.SSHService/SSHUploadPack', 'max_per_repo' => 3 }
          ]
        }
        gitaly['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000',
          'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2'
        }
      # For HTTPS behind a reverse proxy, set
      # GITLAB_EXTERNAL_URL to https://gitlab.example.com and forward to
      # http://<ZimaOS-IP>:8929. Configure the app tile to open the HTTPS URL.
    ports:
      - target: 80
        published: "8929"
        protocol: tcp
      - target: 22
        published: "2424"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /etc/gitlab
      - type: bind
        source: /DATA/AppData/$AppID/logs
        target: /var/log/gitlab
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /var/opt/gitlab
    shm_size: 256m
    # Total RAM + swap allowance; requires at least 1 GB of swap on the host.
    memswap_limit: 3G
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test:
        - CMD
        - /opt/gitlab/bin/gitlab-healthcheck
        - --fail
        - --max-time
        - "10"
      interval: 60s
      timeout: 30s
      start_period: 10m
      retries: 5
    restart: unless-stopped
    stop_grace_period: 120s
    x-casaos:
      envs:
        - container: GITLAB_EXTERNAL_URL
          description:
            en_US: "Required full GitLab URL, for example http://192.168.1.10:8929."
            de_DE: "Erforderliche vollständige GitLab-URL, zum Beispiel http://192.168.1.10:8929."
            zh_CN: "必须填写完整 GitLab 地址，例如 http://192.168.1.10:8929。"
        - container: GITLAB_SSH_PORT
          description:
            en_US: Published SSH port advertised in clone URLs; must match the SSH host port.
            de_DE: In Clone-URLs angezeigter SSH-Port; muss dem veröffentlichten SSH-Hostport entsprechen.
            zh_CN: 克隆地址中显示的 SSH 端口，必须与发布的 SSH 主机端口一致。
      ports:
        - container: "80"
          description:
            en_US: GitLab HTTP port; also update GITLAB_EXTERNAL_URL when changing the host port.
            de_DE: GitLab-HTTP-Port; bei Änderung des Hostports auch GITLAB_EXTERNAL_URL anpassen.
            zh_CN: GitLab HTTP 端口；修改主机端口时也需更新 GITLAB_EXTERNAL_URL。
        - container: "22"
          description:
            en_US: Git over SSH; also update GITLAB_SSH_PORT when changing the host port.
            de_DE: Git über SSH; bei Änderung des Hostports auch GITLAB_SSH_PORT anpassen.
            zh_CN: Git SSH 端口；修改主机端口时也需更新 GITLAB_SSH_PORT。
      volumes:
        - container: /etc/gitlab
          description:
            en_US: GitLab configuration, secrets and SSH host keys.
            de_DE: GitLab-Konfiguration, Geheimnisse und SSH-Hostschlüssel.
            zh_CN: GitLab 配置、密钥及 SSH 主机密钥。
        - container: /var/log/gitlab
          description:
            en_US: GitLab service logs.
            de_DE: Protokolle der GitLab-Dienste.
            zh_CN: GitLab 服务日志。
        - container: /var/opt/gitlab
          description:
            en_US: Repositories, uploads and bundled database data.
            de_DE: Repositories, Uploads und Daten der integrierten Datenbank.
            zh_CN: 仓库、上传文件及内置数据库数据。
