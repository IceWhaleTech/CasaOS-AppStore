  tips:
    before_install:
      en_US: |
        Use Custom Install and set GITLAB_EXTERNAL_URL to the full address you will use, for example http://192.168.1.10:8929. If you change the HTTP host port, update the URL too. If you change the SSH host port, also update GITLAB_SSH_PORT. For HTTPS, use a reverse proxy and set the external URL to your HTTPS address.

        This small-instance profile limits GitLab to 2 GB RAM and 2 vCPUs, with reduced concurrency, monitoring and the Kubernetes agent disabled. Provide at least 1 GB of host swap and SSD storage; this profile is intended for a few users with small repositories. Initial setup can take several minutes. Sign in as root using the generated password in /DATA/AppData/<AppID>/config/initial_root_password, or retrieve it with: docker exec gitlab grep 'Password:' /etc/gitlab/initial_root_password. Save it promptly and change it after signing in; the file is removed on the first restart after 24 hours.

        PostgreSQL and Redis are bundled. GitLab Runner and SMTP are not configured. Back up configuration and data before upgrades, and follow GitLab's required upgrade stops.
      de_DE: |
        Benutzerdefinierte Installation verwenden und GITLAB_EXTERNAL_URL auf die vollständige Zugriffsadresse setzen, zum Beispiel http://192.168.1.10:8929. Bei Änderung des HTTP-Hostports auch die URL anpassen. Bei Änderung des SSH-Hostports auch GITLAB_SSH_PORT anpassen. Für HTTPS einen Reverse Proxy verwenden und die externe URL auf die HTTPS-Adresse setzen.

        Dieses Profil für kleine Installationen begrenzt GitLab auf 2 GB RAM und 2 vCPUs, reduziert die Parallelität und deaktiviert Monitoring sowie den Kubernetes-Agenten. Mindestens 1 GB Swap auf dem Host und SSD-Speicher bereitstellen; das Profil ist für wenige Benutzer mit kleinen Repositories gedacht. Die Ersteinrichtung kann mehrere Minuten dauern. Als root mit dem erzeugten Passwort aus /DATA/AppData/<AppID>/config/initial_root_password anmelden oder es mit folgendem Befehl auslesen: docker exec gitlab grep 'Password:' /etc/gitlab/initial_root_password. Zeitnah sichern und nach der Anmeldung ändern; die Datei wird beim ersten Neustart nach 24 Stunden gelöscht.

        PostgreSQL und Redis sind enthalten. GitLab Runner und SMTP sind nicht eingerichtet. Vor Updates Konfiguration und Daten sichern und GitLabs erforderliche Zwischenversionen beachten.
      zh_CN: |
        请使用自定义安装，将 GITLAB_EXTERNAL_URL 设为完整访问地址，例如 http://192.168.1.10:8929。修改 HTTP 主机端口时也需更新该地址；修改 SSH 主机端口时也需更新 GITLAB_SSH_PORT。如需 HTTPS，请使用反向代理，并将外部地址设为 HTTPS 地址。

        此小型实例配置将 GitLab 限制为 2 GB 内存和 2 个 vCPU，降低并发并禁用监控及 Kubernetes 代理。主机需提供至少 1 GB 交换空间和 SSD 存储；此配置适用于少量用户及小型仓库。首次初始化可能需要数分钟。使用 root 和 /DATA/AppData/<AppID>/config/initial_root_password 中生成的密码登录，或执行 docker exec gitlab grep 'Password:' /etc/gitlab/initial_root_password 获取密码。请及时保存并在登录后修改；该文件会在超过 24 小时后的首次重启时删除。

        已内置 PostgreSQL 和 Redis。未配置 GitLab Runner 和 SMTP。升级前请备份配置和数据，并遵循 GitLab 要求的中间升级版本。
