  title:
    en_US: Karakeep
  version: "0.33.2"
  update_at: "2026-08-11"
  release_notes:
    en_US: |-
      - v0.33.2 migrates to the maintained Karakeep Chrome image, upgrading Chrome from 124 to 151 and replacing the abandoned Alpine Chrome image.
      - It fixes metadata extraction for large SingleFile archives, hardens crawler asset conversion, and pins Node.js to avoid a crash-loop regression.
      - It adds direct custom SingleFile archive uploads through the CLI and a favicon that adapts to the browser theme.
    en_GB: |-
      - v0.33.2 migrates to the maintained Karakeep Chrome image, upgrading Chrome from 124 to 151 and replacing the abandoned Alpine Chrome image.
      - It fixes metadata extraction for large SingleFile archives, hardens crawler asset conversion, and pins Node.js to avoid a crash-loop regression.
      - It adds direct custom SingleFile archive uploads through the CLI and a favicon that adapts to the browser theme.
    it_IT: |-
      - La v0.33.2 migra all'immagine Chrome mantenuta da Karakeep, aggiornando Chrome dalla versione 124 alla 151 e sostituendo l'immagine Alpine Chrome abbandonata.
      - Corregge l'estrazione dei metadati per archivi SingleFile di grandi dimensioni, rende più robusta la conversione delle risorse del crawler e blocca Node.js a una versione che evita un ciclo di crash.
      - Aggiunge il caricamento diretto di archivi SingleFile personalizzati tramite CLI e una favicon che si adatta al tema del browser.
    nb_NO: |-
      - v0.33.2 migrerer til Karakeeps vedlikeholdte Chrome-image, oppgraderer Chrome fra 124 til 151 og erstatter det forlatte Alpine Chrome-imaget.
      - Den retter metadatauttrekk for store SingleFile-arkiver, gjør crawlerens ressurskonvertering mer robust og låser Node.js for å unngå en krasjløkke.
      - Den legger til direkte opplasting av egendefinerte SingleFile-arkiver via CLI og et favicon som tilpasser seg nettlesertemaet.
    zh_CN: |-
      - v0.33.2 迁移到由 Karakeep 维护的 Chrome 镜像，将 Chrome 从 124 升级到 151，并替换已停止维护的 Alpine Chrome 镜像。
      - 修复大型 SingleFile 归档的元数据提取问题，增强抓取器资源转换的可靠性，并固定 Node.js 版本以避免循环崩溃。
      - 新增通过 CLI 直接上传自定义 SingleFile 归档的功能，并使网站图标自动适配浏览器主题。
    ja_JP: |-
      - v0.33.2では、保守が終了したAlpine ChromeイメージをKarakeep管理のChromeイメージに移行し、Chromeを124から151へ更新しました。
      - 大容量SingleFileアーカイブのメタデータ抽出を修正し、クローラーのアセット変換を強化するとともに、クラッシュループを避けるためNode.jsのバージョンを固定しました。
      - CLIからカスタムSingleFileアーカイブを直接アップロードできるようになり、faviconがブラウザテーマに対応しました。
    ko_KR: |-
      - v0.33.2는 유지 관리가 중단된 Alpine Chrome 이미지를 Karakeep에서 관리하는 Chrome 이미지로 교체하고 Chrome을 124에서 151로 업그레이드합니다.
      - 대용량 SingleFile 아카이브의 메타데이터 추출을 수정하고 크롤러 자산 변환을 강화하며 충돌 반복을 방지하도록 Node.js 버전을 고정합니다.
      - CLI를 통한 사용자 지정 SingleFile 아카이브 직접 업로드와 브라우저 테마에 맞춰지는 파비콘을 추가합니다.
    fr_FR: |-
      - La v0.33.2 migre vers l'image Chrome maintenue par Karakeep, met Chrome à niveau de la version 124 à 151 et remplace l'image Alpine Chrome abandonnée.
      - Elle corrige l'extraction des métadonnées des archives SingleFile volumineuses, renforce la conversion des ressources du crawler et épingle Node.js pour éviter une boucle de plantage.
      - Elle ajoute l'envoi direct d'archives SingleFile personnalisées via la CLI et un favicon qui s'adapte au thème du navigateur.
    de_DE: |-
      - v0.33.2 migriert auf das von Karakeep gepflegte Chrome-Image, aktualisiert Chrome von 124 auf 151 und ersetzt das nicht mehr gepflegte Alpine-Chrome-Image.
      - Die Version behebt die Metadatenextraktion großer SingleFile-Archive, härtet die Asset-Konvertierung des Crawlers und fixiert die Node.js-Version, um eine Absturzschleife zu vermeiden.
      - Außerdem ermöglicht sie den direkten Upload eigener SingleFile-Archive per CLI und fügt ein an das Browserdesign angepasstes Favicon hinzu.
    sv_SE: |-
      - v0.33.2 migrerar till Karakeeps underhållna Chrome-image, uppgraderar Chrome från 124 till 151 och ersätter det övergivna Alpine Chrome-imaget.
      - Versionen rättar metadataextraktion för stora SingleFile-arkiv, gör crawlerns resurskonvertering robustare och låser Node.js-versionen för att undvika en kraschloop.
      - Den lägger till direkt uppladdning av anpassade SingleFile-arkiv via CLI och en favicon som anpassas efter webbläsarens tema.
    el_GR: |-
      - Η v0.33.2 μεταβαίνει στο συντηρούμενο Chrome image του Karakeep, αναβαθμίζοντας το Chrome από 124 σε 151 και αντικαθιστώντας το εγκαταλελειμμένο Alpine Chrome image.
      - Διορθώνει την εξαγωγή metadata για μεγάλα SingleFile archives, ενισχύει τη μετατροπή assets του crawler και κλειδώνει την έκδοση Node.js για αποφυγή crash loop.
      - Προσθέτει άμεσο upload προσαρμοσμένων SingleFile archives μέσω CLI και favicon που προσαρμόζεται στο θέμα του browser.
    hr_HR: |-
      - v0.33.2 prelazi na Karakeepovu održavanu Chrome sliku, nadograđuje Chrome sa 124 na 151 i zamjenjuje napuštenu Alpine Chrome sliku.
      - Ispravlja izdvajanje metapodataka za velike SingleFile arhive, poboljšava pretvorbu resursa crawlera i zaključava verziju Node.js-a radi izbjegavanja petlje rušenja.
      - Dodaje izravni prijenos prilagođenih SingleFile arhiva putem CLI-ja i favicon koji se prilagođava temi preglednika.
    pt_PT: |-
      - A v0.33.2 migra para a imagem Chrome mantida pelo Karakeep, atualiza o Chrome da versão 124 para a 151 e substitui a imagem Alpine Chrome abandonada.
      - Corrige a extração de metadados de arquivos SingleFile grandes, reforça a conversão de recursos do crawler e fixa a versão do Node.js para evitar um ciclo de falhas.
