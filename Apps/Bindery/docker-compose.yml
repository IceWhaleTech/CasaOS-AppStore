name: bindery
services:
  bindery:
    image: ghcr.io/vavallee/bindery:1.53.1
    container_name: bindery
    # The image is distroless and cannot switch users at runtime, so the UID
    # is set here. BINDERY_PUID and BINDERY_PGID only check that it matches.
    user: "1000:1000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    environment:
      BINDERY_PUID: "1000"
      BINDERY_PGID: "1000"
      BINDERY_LOG_LEVEL: info
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /books
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    depends_on:
      bindery-init:
        condition: service_completed_successfully
    x-casaos:
      ports:
        - container: "8787"
          description:
            en_US: WebUI HTTP Port
      volumes:
        - container: /config
          description:
            en_US: Database, cover cache and backups
        - container: /books
          description:
            en_US: Ebook library
        - container: /downloads
          description:
            en_US: Completed downloads from your download client
      envs:
        - container: BINDERY_PUID
          description:
            en_US: Must match the UID in the user setting of this container
        - container: BINDERY_PGID
          description:
            en_US: Must match the GID in the user setting of this container
        - container: BINDERY_LOG_LEVEL
          description:
            en_US: debug, info, warn or error

  # Docker creates the bind-mounted config folder as root, and Bindery runs as
  # UID 1000, so hand the folder over before the first start.
  bindery-init:
    image: alpine:3.20
    container_name: bindery-init
    restart: "no"
    command: ["chown", "-R", "1000:1000", "/config"]
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
x-casaos:
  id: dev.getbindery.bindery
  main: bindery
  index: /
  port_map: "8787"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Bindery/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Bindery/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Bindery/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Bindery/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Bindery/screenshot-4.png
  title:
    en_US: Bindery
  tagline:
    en_US: Ebook and audiobook manager for Usenet and BitTorrent users
  description:
    en_US: Bindery is a self-hosted manager for ebook and audiobook libraries. Follow authors and series, search your indexers, send releases to your download client, then import and rename the files into your library. It works with SABnzbd, NZBGet, qBittorrent and other clients, and with Calibre and Audiobookshelf.
  author: vavallee
  developer: vavallee
  category: Media
  architectures:
    - amd64
    - arm64
  tips:
    before_install:
      en_US: |
        Bindery runs as UID and GID 1000. Make sure the books and downloads folders are writable by that user. The first time you open the WebUI you create the admin account. Then add an indexer and a download client in Settings.
  version: "1.53.1"
  update_at: "2026-11-24"
  release_notes:
    en_US: ""
  website: https://getbindery.dev
  repo: https://github.com/vavallee/bindery
  support: https://github.com/vavallee/bindery/issues
  docs: https://github.com/vavallee/bindery/blob/main/docs/DEPLOYMENT.md
