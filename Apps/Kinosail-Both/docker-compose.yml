name: kinosail-both

services:
  player:
    image: ghcr.io/kinosail/kinosail-player:latest
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    user: "10001:10001"
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "38127:38127"
    environment:
      KINOSAIL_DATA_DIR: /config
      KINOSAIL_CACHE_DIR: /cache
      KINOSAIL_MEDIA_DIR: /media
      KINOSAIL_BACKUP_DIR: /backups
    volumes:
      - player-config:/config
      - player-cache:/cache
      - player-backups:/backups
      - type: bind
        source: /DATA/Media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /run:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "kinosail", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3

  subtitles:
    image: ghcr.io/kinosail/kinosail-subtitles:latest
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    user: "10001:10001"
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "38128:38128"
    environment:
      KINOSAIL_DATA_DIR: /config
      KINOSAIL_CACHE_DIR: /cache
      KINOSAIL_MEDIA_DIR: /media
      KINOSAIL_BACKUP_DIR: /backups
    volumes:
      - subtitles-config:/config
      - subtitles-cache:/cache
      - subtitles-backups:/backups
      - type: bind
        source: /DATA/Media
        target: /media
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /run:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "kinosail", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3

volumes:
  player-config:
  player-cache:
  player-backups:
  subtitles-config:
  subtitles-cache:
  subtitles-backups:

x-casaos:
  id: com.kinosail.both
  main: player
  index: /
  port_map: "38127"
  scheme: https
  icon: https://raw.githubusercontent.com/Kinosail/kinosail/main/apps/player/internal/server/static/icon-512.png
  title:
    en_US: Kinosail Both
  tagline:
    en_US: Private media server and subtitle service
  description:
    en_US: Install Player and Subtitles with separate settings and shared media. Mount /DATA/Media with access for user 10001.
  author: Kinosail
  developer: Kinosail
  category: Media
  architectures:
    - amd64
    - arm64
  version: "0.0.1"
  release_notes:
    en_US: Initial catalog package. Installs the current Kinosail container image.
  update_at: "2026-09-27"
  website: https://kinosail.com/
  repo: https://github.com/Kinosail/kinosail
  docs: https://kinosail.com/getting-started/platforms/
