  tagline:
    en_US: Knowledge that never goes offline
    en_GB: Knowledge that never goes offline
    it_IT: Conoscenze disponibili anche senza connessione
    nb_NO: Kunnskap tilgjengelig også uten nett
    zh_CN: 永不离线的知识库
    zh_TW: 永不離線的知識庫
    ja_JP: オフラインでも使える知識ライブラリ
    ko_KR: 오프라인에서도 사용할 수 있는 지식
    fr_FR: Des connaissances accessibles même hors ligne
    de_DE: Wissen, das auch offline verfügbar bleibt
    sv_SE: Kunskap tillgänglig även utan nätanslutning
    el_GR: Γνώση διαθέσιμη ακόμη και χωρίς σύνδεση
    hr_HR: Znanje dostupno i bez interneta
    pt_PT: Conhecimento disponível mesmo sem ligação
    pt_BR: Conhecimento disponível mesmo sem conexão
    es_ES: Conocimiento disponible incluso sin conexión
