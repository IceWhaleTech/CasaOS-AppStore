  release_notes:
    en_US: |-
      1.35.1 (2026-10-05)

      - Restores image attachments for `gemma3` by checking model capabilities when the model list reports no vision support.
      - Preserves upstream redirects in translated content so book styles and article links work.
      - Fixes translation model downloads when prerelease models appear, downloads released language models, and documents supported languages.
      - Updates 11 curated ZIM download links whose upstream files are unavailable.

      [Official release notes](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    en_GB: |-
      1.35.1 (2026-10-05)

      - Restores image attachments for `gemma3` by checking model capabilities when the model list reports no vision support.
      - Preserves upstream redirects in translated content so book styles and article links work.
      - Fixes translation model downloads when prerelease models appear, downloads released language models, and documents supported languages.
      - Updates 11 curated ZIM download links whose upstream files are unavailable.

      [Official release notes](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    it_IT: |-
      1.35.1 (2026-10-05)

      - Verifica le capacità del modello quando l’elenco non indica supporto visivo e ripristina gli allegati immagine per `gemma3`.
      - Mantiene i reindirizzamenti della fonte nei contenuti tradotti, così funzionano gli stili dei libri e i collegamenti agli articoli.
      - Corregge gli arresti durante il download dei modelli di traduzione causati da versioni preliminari, scarica i modelli linguistici pubblicati e documenta le lingue supportate.
      - Aggiorna 11 collegamenti di download di file ZIM selezionati i cui file originali non sono più disponibili.

      [Note di rilascio ufficiali](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    nb_NO: |-
      1.35.1 (2026-10-05)

      - Kontrollerer modellens egenskaper når modellisten ikke oppgir bildestøtte, og gjenoppretter bildevedlegg for `gemma3`.
      - Bevarer omdirigeringer fra innholdskilden i oversatt innhold, slik at bokformatering og artikkellenker fungerer.
      - Retter krasj ved nedlasting av oversettelsesmodeller når forhåndsversjoner dukker opp, laster ned publiserte språkmodeller og dokumenterer støttede språk.
      - Oppdaterer 11 nedlastingslenker for utvalgte ZIM-filer der kildefilene ikke lenger er tilgjengelige.

      [Offisielle versjonsnotater](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    zh_CN: |-
      1.35.1 (2026-10-05)

      - 当模型列表未声明视觉能力时，检测模型的实际能力，恢复 `gemma3` 的图片附件功能。
      - 保留翻译内容的上游重定向，使电子书样式和文章链接正常显示与跳转。
      - 修复遇到预发布翻译模型时下载崩溃的问题，下载已发布的语言模型，并补充支持语言的文档。
      - 更新 11 个精选 ZIM 资源的下载链接，替换上游已失效的文件地址。

      [官方发布说明](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    zh_TW: |-
      1.35.1 (2026-10-05)

      - 當模型清單未宣告視覺能力時，檢測模型的實際能力，恢復 `gemma3` 的圖片附件功能。
      - 保留翻譯內容的上游重新導向，讓電子書樣式和文章連結正常顯示與跳轉。
      - 修正遇到預發佈翻譯模型時下載崩潰的問題，下載已發佈的語言模型，並補充支援語言的文件。
      - 更新 11 個精選 ZIM 資源的下載連結，替換上游已失效的檔案位址。

      [官方發佈說明](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    ja_JP: |-
      1.35.1 (2026-10-05)

      - モデル一覧に画像対応が表示されない場合に実際の能力を確認し、`gemma3` の画像添付を復旧します。
      - 翻訳コンテンツで配信元のリダイレクトを保持し、電子書籍のスタイルと記事リンクを正しく処理します。
      - プレリリースの翻訳モデルによるダウンロードのクラッシュを修正し、公開済み言語モデルをダウンロードして、対応言語を文書化します。
      - 配信元のファイルがなくなった 11 件の厳選 ZIM コンテンツのダウンロードリンクを更新します。

      [公式リリースノート](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    ko_KR: |-
      1.35.1 (2026-10-05)

      - 모델 목록에 이미지 지원이 표시되지 않을 때 실제 기능을 확인하여 `gemma3`의 이미지 첨부 기능을 복원합니다.
      - 번역된 콘텐츠에서 원본 서버의 리디렉션을 유지하여 전자책 스타일과 문서 링크가 정상적으로 작동하게 합니다.
      - 정식 출시 전 번역 모델을 처리할 때 발생하던 비정상 종료를 수정하고, 출시된 언어 모델을 다운로드하며 지원 언어를 문서에 추가합니다.
      - 원본 파일을 사용할 수 없게 된 추천 ZIM 콘텐츠 11개의 다운로드 링크를 업데이트합니다.

      [공식 릴리스 노트](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    fr_FR: |-
      1.35.1 (2026-10-05)

      - Vérifie les capacités du modèle lorsque la liste n’indique pas de prise en charge des images et rétablit les pièces jointes pour `gemma3`.
      - Conserve les redirections de la source des contenus traduits pour préserver les styles des livres et le fonctionnement des liens vers les articles.
      - Corrige les plantages du téléchargement des modèles de traduction liés aux préversions, télécharge les modèles de langue publiés et documente les langues prises en charge.
      - Actualise 11 liens de téléchargement de fichiers ZIM sélectionnés dont les fichiers sources ne sont plus disponibles.

      [Notes de version officielles](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    de_DE: |-
      1.35.1 (2026-10-05)

      - Prüft die Modellfähigkeiten, wenn die Modellliste keine Bildunterstützung meldet, und stellt Bildanhänge für `gemma3` wieder her.
      - Erhält Weiterleitungen der Inhaltsquelle bei Übersetzungen, damit Buchformatierung und Artikellinks funktionieren.
      - Behebt Abstürze beim Download von Übersetzungsmodellen durch Vorabversionen, lädt veröffentlichte Sprachmodelle herunter und dokumentiert die unterstützten Sprachen.
      - Aktualisiert 11 Downloadlinks kuratierter ZIM-Dateien, deren Quelldateien nicht mehr verfügbar sind.

      [Offizielle Versionshinweise](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    sv_SE: |-
      1.35.1 (2026-10-05)

      - Kontrollerar modellens förmågor när modellistan saknar bildstöd och återställer bildbilagor för `gemma3`.
      - Bevarar omdirigeringar från innehållskällan i översatt innehåll så att bokstilar och artikellänkar fungerar.
      - Åtgärdar krascher vid hämtning av översättningsmodeller när förhandsversioner förekommer, hämtar publicerade språkmodeller och dokumenterar språkstödet.
      - Uppdaterar 11 hämtningslänkar för utvalda ZIM-filer vars källfiler inte längre är tillgängliga.

      [Officiella versionsanteckningar](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    el_GR: |-
      1.35.1 (2026-10-05)

      - Ελέγχει τις δυνατότητες του μοντέλου όταν η λίστα δεν δηλώνει υποστήριξη εικόνων και επαναφέρει τα συνημμένα εικόνας για το `gemma3`.
      - Διατηρεί τις ανακατευθύνσεις της πηγής στο μεταφρασμένο περιεχόμενο, ώστε να λειτουργούν η μορφοποίηση των βιβλίων και οι σύνδεσμοι άρθρων.
      - Διορθώνει καταρρεύσεις κατά τη λήψη μοντέλων μετάφρασης που προκαλούσαν οι προεκδόσεις, κατεβάζει τα δημοσιευμένα γλωσσικά μοντέλα και τεκμηριώνει τις υποστηριζόμενες γλώσσες.
      - Ενημερώνει 11 συνδέσμους λήψης επιλεγμένων αρχείων ZIM των οποίων τα αρχικά αρχεία δεν είναι πλέον διαθέσιμα.

      [Επίσημες σημειώσεις έκδοσης](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    hr_HR: |-
      1.35.1 (2026-10-05)

      - Provjerava mogućnosti modela kada popis ne navodi podršku za slike i vraća slikovne privitke za `gemma3`.
      - Zadržava preusmjeravanja izvora u prevedenom sadržaju kako bi stilovi knjiga i poveznice na članke radili.
      - Ispravlja rušenja pri preuzimanju modela za prijevod uzrokovana predizdanjima, preuzima objavljene jezične modele i dokumentira podržane jezike.
      - Ažurira 11 poveznica za preuzimanje odabranih ZIM datoteka čije izvorne datoteke više nisu dostupne.

      [Službene bilješke o izdanju](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    pt_PT: |-
      1.35.1 (2026-10-05)

      - Verifica as capacidades do modelo quando a lista não indica suporte visual e restaura os anexos de imagem para `gemma3`.
      - Preserva os redirecionamentos da origem nos conteúdos traduzidos para que funcionem os estilos dos livros e as ligações aos artigos.
      - Corrige falhas no descarregamento de modelos de tradução causadas por versões preliminares, descarrega os modelos linguísticos publicados e documenta os idiomas suportados.
      - Atualiza 11 ligações de descarregamento de ficheiros ZIM selecionados cujos ficheiros de origem já não estão disponíveis.

      [Notas de lançamento oficiais](https://github.com/Crosstalk-Solutions/project-nomad/releases/tag/v1.35.1)
    pt_BR: |-
      1.35.1 (2026-10-05)

      - Verifica as capacidades do modelo quando a lista não informa suporte visual e restaura os anexos de imagem para `gemma3`.
