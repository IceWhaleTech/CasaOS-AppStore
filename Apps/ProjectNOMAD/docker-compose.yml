  id: org.icewhale.project-nomad
  architectures:
    - amd64
  main: admin
  author: IceWhaleTech
  developer: Crosstalk Solutions
  category: Productivity
  title:
    en_US: Project NOMAD
    en_GB: Project NOMAD
    it_IT: Project NOMAD
    nb_NO: Project NOMAD
    zh_CN: Project NOMAD
    zh_TW: Project NOMAD
    ja_JP: Project NOMAD
    ko_KR: Project NOMAD
    fr_FR: Project NOMAD
    de_DE: Project NOMAD
    sv_SE: Project NOMAD
