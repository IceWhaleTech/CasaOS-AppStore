  release_notes:
    en_US: |-
      - Update to Emby Server 4.10.2.0 stable.
      - Improve search performance and fix Spotlight issues on older devices.
      - Fix playback from the Albums tab and subtitle-off settings not being remembered.
      - Add an option to disable folder outlines and improve the Live TV tuner detection dialog.
    en_GB: |-
      - Update to Emby Server 4.10.2.0 stable.
      - Improve search performance and fix Spotlight issues on older devices.
      - Fix playback from the Albums tab and subtitle-off settings not being remembered.
      - Add an option to disable folder outlines and improve the Live TV tuner detection dialog.
    it_IT: |-
      - Aggiornamento alla versione stabile di Emby Server 4.10.2.0.
      - Migliorate le prestazioni di ricerca e corretti i problemi di Spotlight sui dispositivi meno recenti.
      - Corretta la riproduzione dalla scheda Album e la mancata memorizzazione della disattivazione dei sottotitoli.
      - Aggiunta un’opzione per disattivare i contorni delle cartelle e migliorata la finestra di rilevamento dei sintonizzatori TV in diretta.
    nb_NO: |-
      - Oppdatert til den stabile versjonen av Emby Server 4.10.2.0.
      - Forbedret søkeytelse og rettet Spotlight-problemer på eldre enheter.
      - Rettet avspilling fra Album-fanen og at deaktivering av undertekster ikke ble husket.
      - Lagt til et alternativ for å deaktivere mappeomriss og forbedret dialogen for registrering av direktesendte TV-mottakere.
    zh_CN: |-
      - 更新至 Emby Server 4.10.2.0 稳定版。
      - 提升搜索性能，修复旧设备上的 Spotlight 问题。
      - 修复从专辑标签页播放的问题，以及关闭字幕的设置未被记住的问题。
      - 新增禁用文件夹轮廓的选项，并改进直播电视调谐器检测对话框。
    ja_JP: |-
      - Emby Server 4.10.2.0 安定版に更新。
      - 検索性能を改善し、古いデバイスでの Spotlight の問題を修正。
      - アルバムタブからの再生と、字幕をオフにした設定が保存されない問題を修正。
      - フォルダーの枠線を無効にするオプションを追加し、ライブ TV チューナー検出ダイアログを改善。
    ko_KR: |-
      - Emby Server 4.10.2.0 안정 버전으로 업데이트했습니다.
      - 검색 성능을 개선하고 구형 기기의 Spotlight 문제를 수정했습니다.
      - 앨범 탭에서의 재생 문제와 자막 끄기 설정이 저장되지 않는 문제를 수정했습니다.
      - 폴더 윤곽선 비활성화 옵션을 추가하고 라이브 TV 튜너 감지 대화 상자를 개선했습니다.
    fr_FR: |-
      - Mise à jour vers la version stable Emby Server 4.10.2.0.
      - Amélioration des performances de recherche et correction de problèmes de Spotlight sur les anciens appareils.
      - Correction de la lecture depuis l’onglet Albums et de la désactivation des sous-titres non mémorisée.
      - Ajout d’une option pour désactiver les contours des dossiers et amélioration de la boîte de dialogue de détection des tuners TV en direct.
    de_DE: |-
      - Aktualisierung auf die stabile Version Emby Server 4.10.2.0.
      - Suchleistung verbessert und Spotlight-Probleme auf älteren Geräten behoben.
      - Wiedergabe im Tab Alben und das Speichern deaktivierter Untertitel korrigiert.
      - Option zum Deaktivieren von Ordnerumrandungen hinzugefügt und den Dialog zur Live-TV-Tuner-Erkennung verbessert.
    sv_SE: |-
      - Uppdaterat till den stabila versionen av Emby Server 4.10.2.0.
      - Förbättrad sökprestanda och åtgärdade Spotlight-problem på äldre enheter.
      - Åtgärdat uppspelning från fliken Album och att avstängning av undertexter inte sparades.
      - Lagt till ett alternativ för att inaktivera mappkonturer och förbättrat dialogrutan för upptäckt av live-TV-mottagare.
    el_GR: |-
      - Ενημέρωση στη σταθερή έκδοση Emby Server 4.10.2.0.
      - Βελτίωση της απόδοσης αναζήτησης και διόρθωση προβλημάτων Spotlight σε παλαιότερες συσκευές.
      - Διόρθωση της αναπαραγωγής από την καρτέλα Άλμπουμ και της μη αποθήκευσης της απενεργοποίησης υποτίτλων.
      - Προσθήκη επιλογής απενεργοποίησης περιγραμμάτων φακέλων και βελτίωση του διαλόγου εντοπισμού δεκτών ζωντανής TV.
    hr_HR: |-
      - Ažuriranje na stabilnu verziju Emby Server 4.10.2.0.
      - Poboljšane performanse pretraživanja i ispravljeni problemi značajke Spotlight na starijim uređajima.
      - Ispravljena reprodukcija s kartice Albumi i pamćenje postavke isključenih titlova.
      - Dodana opcija za isključivanje obrisa mapa i poboljšan dijaloški okvir za otkrivanje TV prijamnika uživo.
    pt_PT: |-
      - Atualização para a versão estável do Emby Server 4.10.2.0.
      - Melhorias no desempenho da pesquisa e correção de problemas do Spotlight em dispositivos mais antigos.
      - Correção da reprodução no separador Álbuns e da definição de desativação das legendas que não era guardada.
      - Adicionada uma opção para desativar os contornos das pastas e melhorado o diálogo de deteção de sintonizadores de TV em direto.
    ru_RU: |-
      - Обновление до стабильной версии Emby Server 4.10.2.0.
      - Улучшена производительность поиска и исправлены проблемы Spotlight на старых устройствах.
      - Исправлены воспроизведение на вкладке «Альбомы» и сохранение настройки отключения субтитров.
      - Добавлена возможность отключить контуры папок и улучшен диалог обнаружения ТВ-тюнеров.
    tr_TR: |-
      - Emby Server 4.10.2.0 kararlı sürümüne güncellendi.
      - Arama performansı iyileştirildi ve eski cihazlardaki Spotlight sorunları düzeltildi.
      - Albümler sekmesinden oynatma ve altyazıları kapatma ayarının hatırlanmaması sorunları düzeltildi.
      - Klasör ana hatlarını devre dışı bırakma seçeneği eklendi ve canlı TV alıcısı algılama iletişim kutusu iyileştirildi.
