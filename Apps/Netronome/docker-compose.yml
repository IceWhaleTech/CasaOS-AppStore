name: netronome

services:
  netronome:
    image: ghcr.io/autobrr/netronome:v0.13.0
    container_name: netronome
    restart: unless-stopped
    entrypoint:
      - /sbin/tini
      - --
      - /bin/sh
      - -c
    command:
      - |-
        config=/data/.config/netronome/config.toml
        if [ ! -f "$$config" ]; then
          netronome generate-config
        fi
        exec netronome serve
    ports:
      - target: 7575
        published: "7575"
        protocol: tcp
    environment:
      TZ: $TZ
      NETRONOME__HOST: 0.0.0.0
      NETRONOME__PORT: 7575
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    cap_add:
      - NET_RAW
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Time zone
            zh_CN: 时区
      ports:
        - container: "7575"
          description:
            en_US: WebUI HTTP Port
            zh_CN: WebUI HTTP 端口
      volumes:
        - container: /data
          description:
            en_US: Netronome data directory
            zh_CN: Netronome 数据目录

x-casaos:
  id: org.icewhale.netronome
  main: netronome
  index: /
  port_map: "7575"
  scheme: http
  architectures:
    - amd64
    - arm64
  title:
    en_US: Netronome
    zh_CN: Netronome
  author: autobrr
  developer: autobrr
  category: Networking
  icon: "https://cdn.jsdelivr.net/gh/IceWhaleTech/\
    CasaOS-AppStore@main/Apps/Netronome/icon.png"
  thumbnail: "https://cdn.jsdelivr.net/gh/IceWhaleTech/\
    CasaOS-AppStore@main/Apps/Netronome/thumbnail.png"
  screenshot_link:
    - "https://cdn.jsdelivr.net/gh/IceWhaleTech/\
      CasaOS-AppStore@main/Apps/Netronome/screenshot-1.png"
    - "https://cdn.jsdelivr.net/gh/IceWhaleTech/\
      CasaOS-AppStore@main/Apps/Netronome/screenshot-2.png"
  tagline:
    en_US: Monitor, analyze, and alert on network performance.
    zh_CN: 监控、分析网络性能并及时告警。
  description:
    en_US: >-
      Netronome is a complete network performance monitoring solution with
      speed tests, continuous packet-loss monitoring, distributed server
      agents, automated alerts, visualizations, and historical tracking.
    zh_CN: >-
      Netronome 是一套完整的网络性能监控方案，支持测速、持续丢包监控、
      分布式服务器代理、自动告警、可视化和历史数据追踪。
  version: "0.13.0"
  update_at: "2026-07-30"
  release_notes:
    en_US: |-
      - Removes the three-agent limit from featured dashboard agents.
      - Adds theme support with optional premium themes.
      - Fixes ntfy query parameter handling and PWA precaching.
      - Resolves upstream dependency security alerts.
    zh_CN: |-
      - 移除仪表盘精选代理的三个代理数量限制。
      - 新增主题支持及可选高级主题。
      - 修复 ntfy 查询参数处理和 PWA 预缓存。
      - 修复上游依赖安全告警。
  website: https://netrono.me
  repo: https://github.com/autobrr/netronome
  support: https://github.com/autobrr/netronome/issues
  docs: https://netrono.me
