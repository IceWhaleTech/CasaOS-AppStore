name: libredb-studio
services:
  libredb-studio:
    image: libredb/libredb-studio:0.16.2
    container_name: libredb-studio
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3016"
        protocol: tcp
    environment:
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: ""
      JWT_SECRET: ""
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/db/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    privileged: false
    x-casaos:
      envs:
        - container: ADMIN_EMAIL
          description:
            en_US: Email address for the initial admin account created on first start.
            zh_CN: 首次启动时创建的初始管理员账户的电子邮件地址。
        - container: ADMIN_PASSWORD
          description:
            en_US: Leave empty and the app generates a strong password on first start and prints it once to the container log. Set your own only if you prefer to choose it.
            zh_CN: 留空时，应用会在首次启动时生成强密码并在容器日志中打印一次。仅在希望自行指定时填写。
        - container: JWT_SECRET
          description:
            en_US: Leave empty and a strong secret is generated on first start. This value also encrypts saved connection passwords, so never reuse a value published anywhere. If you set your own it must be at least 32 characters, or the container exits at boot.
            zh_CN: 留空时会在首次启动时生成强密钥。该值同时用于加密已保存的连接密码，因此切勿使用任何公开过的值。如自行设置，长度至少为 32 个字符，否则容器将在启动时退出。
        - container: STORAGE_PROVIDER
          description:
            en_US: Storage backend. Keep as "sqlite" for a self-contained setup.
            zh_CN: 存储后端。独立部署请保持为 "sqlite"。
        - container: STORAGE_SQLITE_PATH
          description:
            en_US: Path to the SQLite database file inside the persistent data volume.
            zh_CN: 持久化数据卷内 SQLite 数据库文件的路径。
        - container: AUTH_COOKIE_SECURE
          description:
            en_US: Keep "false" so the auth cookie works over plain HTTP on the LAN, otherwise login fails.
            zh_CN: 请保持为 "false"，以便身份验证 Cookie 在局域网的普通 HTTP 下正常工作，否则将无法登录。
      ports:
        - container: "3000"
          description:
            en_US: WebUI HTTP Port
            zh_CN: WebUI HTTP 端口
          protocol: tcp
      volumes:
        - container: /app/data
          description:
            en_US: LibreDB Studio data directory (SQLite database).
            zh_CN: LibreDB Studio 数据目录（SQLite 数据库）。
x-casaos:
  id: org.icewhale.libredbstudio
  architectures:
    - amd64
    - arm64
  main: libredb-studio
  author: libredb
  category: Developer
  description:
    en_US: LibreDB Studio is an open-source (MIT), self-hosted SQL IDE. It provides a modern web-based interface to connect to 16 database engines (PostgreSQL, MySQL, MongoDB, Redis, ClickHouse and more), browse schemas, write and run SQL queries, and manage your data from any browser on your LAN. Data is stored locally in a SQLite database, so everything stays under your control.
    zh_CN: LibreDB Studio 是一款开源（MIT）的自托管 SQL IDE。它提供现代化的基于 Web 的界面，可连接数据库、浏览架构、编写并运行 SQL 查询，并可通过局域网中的任意浏览器管理数据。数据本地存储于 SQLite 数据库中，一切尽在您的掌控之中。
  developer: libredb
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-3.png
  tagline:
    en_US: Open-source self-hosted SQL IDE.
    zh_CN: 开源自托管 SQL IDE。
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/thumbnail.png
  title:
    en_US: LibreDB Studio
    zh_CN: LibreDB Studio
  index: /
  scheme: http
  port_map: "3016"
  version: "0.16.2"
  update_at: "2026-09-21"
  release_notes:
    en_US: |-
      - Updates LibreDB Studio to 0.16.2. This release closes a security defect, GHSA-3wh2-8x78-jfw4, scored 8.8.
      - A connection id sent in a request could select another session's database provider, already authenticated as that user. A `user` account could reach a connection restricted to `admin`. The cache key is now derived from the server the connection resolves to and a digest of its credentials, so a forged id buys nothing. Upgrade if more than one account reaches your instance.
      - Schema diff reads a column default as a value rather than as SQL. A default of `0`, `''` or `false` used to read as absent and was dropped from the generated DDL.
      - An Elasticsearch connection can authenticate with an API key id and secret, not only a username and password.
      - Query results page from the stats strip. A `LIMIT` you typed is now a hard bound, while a capped preview stays readable beyond its first page.
      - The example compose stacks publish their PostgreSQL and Vault containers on the loopback interface only, so a demo on a host with a public address no longer exposes them.
    zh_CN: |-
      - 将 LibreDB Studio 更新至 0.16.2。本次发布修复了一个安全缺陷 GHSA-3wh2-8x78-jfw4，评分 8.8。
      - 请求中传入的连接 id 可以选中其他会话的数据库提供者，且该提供者已以对方身份完成认证。`user` 账户因此可以访问仅限 `admin` 的连接。缓存键现在由连接指向的服务器和凭据摘要推导得出，伪造 id 不再有任何作用。若有多个账户访问你的实例，请升级。
      - 结构差异比对现在把列默认值当作值而非 SQL 读取。此前 `0`、`''` 或 `false` 这类默认值会被视为缺失，并从生成的 DDL 中丢失。
      - Elasticsearch 连接可以使用 API key 的 id 与 secret 认证，不再只支持用户名和密码。
      - 查询结果可从统计条分页。你自己写的 `LIMIT` 现在是硬边界，而受限预览可以翻到第一页之后。
      - 示例 compose 栈的 PostgreSQL 与 Vault 容器只监听回环地址，在有公网地址的主机上做演示不会再把它们暴露出去。
  website: https://libredb.org
  repo: https://github.com/libredb/libredb-studio
  support: https://github.com/libredb/libredb-studio/issues
  docs: https://github.com/libredb/libredb-studio/tree/main/docs
