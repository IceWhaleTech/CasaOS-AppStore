name: libredb-studio
services:
  libredb-studio:
    image: libredb/libredb-studio:0.18.3
    container_name: libredb-studio
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3016"
        protocol: tcp
    environment:
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: ""
      JWT_SECRET: ""
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/db/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    privileged: false
    x-casaos:
      envs:
        - container: ADMIN_EMAIL
          description:
            en_US: Email address for the initial admin account created on first start.
            zh_CN: 首次启动时创建的初始管理员账户的电子邮件地址。
        - container: ADMIN_PASSWORD
          description:
            en_US: Leave empty and the app generates a strong password on first start and prints it once to the container log. Set your own only if you prefer to choose it. It applies on the first start only. To change the password later, set this to the new value, add ADMIN_PASSWORD_RESET=true, restart, then remove that variable.
            zh_CN: 留空时，应用会在首次启动时生成强密码并在容器日志中打印一次。仅在希望自行指定时填写。该值仅在首次启动时生效：之后如需更改密码，请将其设为新值并添加 ADMIN_PASSWORD_RESET=true，重启后再删除该变量。
        - container: JWT_SECRET
          description:
            en_US: Leave empty and a strong secret is generated on first start. This value also encrypts saved connection passwords, so never reuse a value published anywhere. If you set your own it must be at least 32 characters, or the container exits at boot.
            zh_CN: 留空时会在首次启动时生成强密钥。该值同时用于加密已保存的连接密码，因此切勿使用任何公开过的值。如自行设置，长度至少为 32 个字符，否则容器将在启动时退出。
        - container: STORAGE_PROVIDER
          description:
            en_US: Storage backend. Keep as "sqlite" for a self-contained setup.
            zh_CN: 存储后端。独立部署请保持为 "sqlite"。
        - container: STORAGE_SQLITE_PATH
          description:
            en_US: Path to the SQLite database file inside the persistent data volume.
            zh_CN: 持久化数据卷内 SQLite 数据库文件的路径。
        - container: AUTH_COOKIE_SECURE
          description:
            en_US: Keep "false" so the auth cookie works over plain HTTP on the LAN, otherwise login fails.
            zh_CN: 请保持为 "false"，以便身份验证 Cookie 在局域网的普通 HTTP 下正常工作，否则将无法登录。
      ports:
        - container: "3000"
          description:
            en_US: WebUI HTTP Port
            zh_CN: WebUI HTTP 端口
          protocol: tcp
      volumes:
        - container: /app/data
          description:
            en_US: LibreDB Studio data directory (SQLite database).
            zh_CN: LibreDB Studio 数据目录（SQLite 数据库）。
x-casaos:
  id: org.icewhale.libredbstudio
  architectures:
    - amd64
    - arm64
  main: libredb-studio
  author: libredb
  category: Developer
  description:
    en_US: LibreDB Studio is an open-source (MIT), self-hosted SQL IDE. It provides a modern web-based interface to connect to twenty-seven database engines (PostgreSQL, MySQL, Oracle, Db2, SQL Server, MongoDB, Redis, ClickHouse, Cassandra, Elasticsearch, Prometheus, Apache Kafka, Neo4j, Qdrant, Milvus, InfluxDB, etcd and more), browse schemas, and write and run queries from any browser on your LAN. Three of the twenty-seven are read-only because their own SQL is. Druid, Elasticsearch and OpenSearch have no `UPDATE` and no `CREATE TABLE` at all. Several more are read-only by construction. Data is stored locally in a SQLite database, so everything stays under your control.
    zh_CN: LibreDB Studio 是一款开源（MIT）的自托管 SQL IDE。它提供现代化的基于 Web 的界面，支持连接 27 种数据库引擎（PostgreSQL、MySQL、Oracle、Db2、SQL Server、MongoDB、Redis、ClickHouse、Cassandra、Elasticsearch、Prometheus、Apache Kafka、Neo4j、Qdrant、Milvus、InfluxDB、etcd 等），浏览架构，并可通过局域网中的任意浏览器编写和运行查询。其中三种（Druid、Elasticsearch、OpenSearch）为只读，因为它们自身的 SQL 完全没有 `UPDATE`，也没有 `CREATE TABLE`；另有数种出于设计为只读。数据本地存储于 SQLite 数据库中，一切尽在您的掌控之中。
  developer: libredb
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/screenshot-3.png
  tagline:
    en_US: Open-source self-hosted SQL IDE.
    zh_CN: 开源自托管 SQL IDE。
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/thumbnail.png
  title:
    en_US: LibreDB Studio
    zh_CN: LibreDB Studio
  index: /
  scheme: http
  port_map: "3016"
  version: "0.18.3"
  update_at: "2026-10-16"
  release_notes:
    en_US: |-
      - Updates LibreDB Studio to 0.18.3, a patch release. Two read-only connection types join since 0.18.2, taking the count to 29: Kubernetes, which reads one cluster over the API server with no driver, and S3-compatible object storage, verified on MinIO, Silo, Garage and RustFS and not on AWS S3 or any hosted service.
      - The image carries no security fix this time, so there is no urgency to upgrade. The one security fix in this release is in the Helm chart, which this app does not use.
      - A connection whose host never answers now fails with a sentence naming the host, the port and the seconds waited, instead of a Test Connection that hangs or suggests trying a simpler query.
      - Query history now masks the value of a credential flag such as `--token` as `***`, including when the value hides behind a no-break space, a zero-width character or a typographic dash.
      - Fixes land on StarRocks inline row edits, RisingWave read-back after an edit, ScyllaDB View Source on a materialized view, Milvus collections with dynamic fields, Oracle Generate Test Data, and Test Connection on Couchbase and Trino, which no longer reports success for a bucket or a pinned catalog that is not there. Terminate on a session row is now offered only to an admin.
    zh_CN: |-
      - 将 LibreDB Studio 更新至 0.18.3，这是一个补丁版本。自 0.18.2 起新增两种只读连接类型，总数达到 29 种：Kubernetes（通过 API Server 读取单个集群，无需驱动）和兼容 S3 的对象存储（已在 MinIO、Silo、Garage 和 RustFS 上验证，未在 AWS S3 或任何托管服务上验证）。
      - 本次镜像不包含安全修复，因此无需急于升级。本版本中唯一的安全修复位于 Helm chart，而本应用并不使用它。
      - 当主机始终没有响应时，连接现在会直接报错，并在提示中写明主机、端口和已等待的秒数，而不再让连接测试一直挂起或建议改用更简单的查询。
      - 查询历史现在会把 `--token` 等凭据参数的值显示为 `***`，即使该值前后夹着不换行空格、零宽字符或排版连字符也同样生效。
      - 本次修复涵盖：StarRocks 的行内编辑、RisingWave 编辑后的回读、ScyllaDB 物化视图的查看源码、含动态字段的 Milvus 集合、Oracle 的生成测试数据，以及 Couchbase 和 Trino 的连接测试（不再对不存在的 bucket 或固定目录报告成功）。会话行上的终止操作现在仅对管理员可用。
  website: https://libredb.org
  repo: https://github.com/libredb/libredb-studio
  support: https://github.com/libredb/libredb-studio/issues
  docs: https://github.com/libredb/libredb-studio/tree/main/docs
