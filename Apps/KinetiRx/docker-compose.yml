# CasaOS/ZimaOS x-casaos v2 manifest. Kept separate from deploy/docker-compose.yml
# because CasaOS installs from published images (image:), not a source build (build:).
#
# $AppID is a real CasaOS-substituted variable (used only in volume paths below).
# $PORT and $AppID_<VAR> are not — don't reintroduce them, they silently resolve empty.

name: kinetirx

services:
  # Service keys stay plain (postgres/backend/frontend): the frontend image's
  # nginx.conf has `proxy_pass http://backend:8080` baked in at build time.
  # container_name/hostname carry the kinetirx- prefix for host uniqueness instead.
  postgres:
    image: postgres:16-alpine
    container_name: kinetirx-postgres
    hostname: kinetirx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinetirx
      POSTGRES_PASSWORD: "please-change-this-password"
      POSTGRES_DB: kinetirx
    volumes:
      - /DATA/AppData/$AppID/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetirx -d kinetirx"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kinetirx_net

  backend:
    image: ghcr.io/raktim94/kinetirx-backend:1.5.0
    container_name: kinetirx-backend
    hostname: kinetirx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://kinetirx:please-change-this-password@postgres:5432/kinetirx?sslmode=disable"
      JWT_SECRET: "please-change-this-jwt-secret-before-going-live"
      # Left blank on purpose — create the admin account from the app's own
      # first-run screen on first visit instead of a shared default password.
      KINETIRX_ADMIN_PASSWORD: ""
      GEMINI_API_KEY: ""
      # Optional — enables Settings -> S3 Offsite Backup. Leave blank to keep
      # that feature disabled (it fails closed with a clear in-app error
      # rather than storing a backup secret in plaintext).
      BACKUP_ENCRYPTION_KEY: ""
      PORT: "8080"
      GIN_MODE: release
      ALLOWED_ORIGINS: "http://localhost:3080"
    networks:
      - kinetirx_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    x-casaos:
      envs:
        - container: DATABASE_URL
          description:
            en_US: Must match the Postgres password below if you change it. Leave as default unless you know why you're changing it.
        - container: JWT_SECRET
          description:
            en_US: Signs login sessions. Change this to a long random value (32+ random bytes) before exposing the instance beyond your own LAN — changing it later logs everyone out.
        - container: KINETIRX_ADMIN_PASSWORD
          description:
            en_US: Optional. Leave blank to create the admin account from the app's own first-run screen instead. If set, it seeds the Master Admin account (id EMP-ADMIN-1) on first boot — change it immediately after first login from Employee Control, there is no password-reset flow.
        - container: GEMINI_API_KEY
          description:
            en_US: Optional — enables AI-powered OCR bill scanning and the clinical AI assistant. Leave blank to run those features in offline/fallback mode.
        - container: BACKUP_ENCRYPTION_KEY
          description:
            en_US: "Optional — required to use Settings -> S3 Offsite Backup (your own S3-compatible bucket, e.g. R2/MinIO/Backblaze). Generate one with: openssl rand -hex 32. Leave blank if you don't need automatic offsite backups."

  frontend:
    image: ghcr.io/raktim94/kinetirx-frontend:1.5.0
    container_name: kinetirx-frontend
    hostname: kinetirx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - target: 80
        published: "3080"
        protocol: tcp
    networks:
      - kinetirx_net
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: Web UI port.

networks:
  kinetirx_net:
    driver: bridge

x-casaos:
  id: com.nodedr.kinetirx
  architectures:
    - amd64
    - arm64
  main: frontend
  category: Productivity
  author: Nodedr Infotech Private Limited
  developer: Raktim94
  # This copy lives in the CasaOS-AppStore fork itself, so assets are served
  # via jsdelivr CDN against this repo (the source repo's own manifest at
  # KinetiRx/casaos/docker-compose.yml instead self-references raw GitHub
  # URLs, so it works standalone pre-merge).
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/screenshot-4.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/KinetiRx/screenshot-5.png
  title:
    en_US: KinetiRx
  tagline:
    en_US: Pharmacy & clinic management — POS, inventory, patients, and daily accounts in one app.
  description:
    en_US: >-
      KinetiRx (Pharma Care Pro) is a self-hosted pharmacy and small-clinic
      management system: point-of-sale billing with GST invoicing, medicine
      inventory and distributor tracking, patient records and due-khata
      (credit ledger), OPD visit scheduling, daily sales/cash-drawer
      reconciliation, expense tracking, doctor outreach campaigns, and
      role-based employee accounts — all backed by your own Postgres
      database running on this device, with no third-party SaaS dependency
      for core operations. Optional Gemini AI integration adds purchase-bill
      OCR scanning and a clinical assistant when a Gemini API key is
      supplied.
  tips:
    before_install:
      en_US: >-
        On first visit, create your admin account right in the app — no
        manual configuration needed. **Change the Postgres password and JWT
        secret below before using this for anything beyond a local trial**
        — neither is auto-generated. To use Settings -> S3 Offsite Backup,
        set BACKUP_ENCRYPTION_KEY below first (openssl rand -hex 32) — the
        S3 endpoint/bucket/keys themselves are entered later, from Settings.
  index: /
  port_map: "3080"
  scheme: http
  version: "1.5.0"
  update_at: "2026-08-31"
  release_notes:
    en_US: |-
      1.5.0: Added bulk stock import from a CSV or Excel file (Medicine
      Stock -> Import CSV / Excel), with a downloadable template and a
      preview of what will be added before you confirm. Add Stock now lets
      you pick a Pack Type (Strip/Bottle/Tube/Vial/Ampoule/Sachet/Box/Jar)
      instead of assuming everything is a tablet strip, with a live
      loose-dispensing price preview — so syrups, ointments and injectables
      can have a correct per-ml/per-gm loose price, calculated the same
      GST-inclusive way as strips. Fixed a real bug where "Generate
      Barcode" (Inventory or POS) silently failed to save — the barcode
      column never existed in the database, so it reappeared as unassigned
      after every refresh; barcodes generated from now on persist properly
      and the barcode dialog updates immediately instead of needing to be
      reopened. Added a barcode/print action directly to POS item rows.

      1.4.2: Fixed Add Stock's "Type New Custom Distributor" option doing
      nothing on a fresh install with no distributors yet. Removed
      pre-filled placeholder-looking data across the app so new entries
      start genuinely blank instead of needing to be noticed and
      overwritten: Add Stock and Add Lab Stock fields, four separate
      hardcoded demo doctor lists (now one real, empty-by-default list
      shared across OPD/POS/Patients), 6 fake lab tests that used to
      appear in every install's POS, and two demo doctor names a prior
      version had seeded into the database. Every new employee account
      now gets a random temporary password instead of the same static
      default. Fixed a bug where OPD patient registration could silently
      record a fabricated age/gender when left blank, or fail outright
      with a save error. Fixed the OPD-to-patient link not actually being
      saved. Fixed a deeper bug that could occasionally create duplicate
      records (or fail with a "already exists" error) when adding stock,
      distributors, or other list-backed data.

      1.4.1: Removed the Bengali subtitles from the OPD and Special Need
      Medicine Order forms and the POS stock badge — labels are English-only
      now. No functional changes.

      1.4.0: OPD and Special Need Medicine Order registration now match the
      full clinical workflow — sequential patient IDs starting at 1 (shared
      and collision-free across both forms), doctor add/remove management,
      a multi-medicine order list with unit (Strips/Vials/Boxes/etc) and a
      tablets-per-strip field that calculates the loose-tablet count, and
      inline supplier registration. POS gained real barcode/QR scanning —
      a USB hardware scanner is picked up automatically, or scan with the
      camera — plus barcode generation and printable labels from Inventory.
      Added a self-service S3 offsite backup (Settings -> S3 Offsite
      Backup): point it at your own S3-compatible bucket (AWS S3, R2,
      Backblaze, MinIO...), scheduled + manual backups that are verified
      by downloading them back and checksum-comparing before being trusted,
      restore from a verified backup or a locally re-uploaded file, and a
      one-click local backup download — all gated behind admin auth and a
      typed confirmation for anything destructive. Settings also gained a
      Currency picker (now reflected across POS, invoices, receipts, and
      every report/export), a GST rate field when adding stock, and a GST
      filing export (HSN-wise taxable value / tax summary for return
      filing). Consolidated Invoice Settings and Backup & Reset into a
      single Settings entry. Cleaned up decorative emoji from receipts,
      WhatsApp messages, and UI text throughout.

      1.3.0: Fixed thermal receipt printing (80mm/58mm and A4 now render
      correctly instead of losing all layout in the print window) with a
      per-bill format picker. Added live sync so a second cashier/pharmacist/
      director counter sees new sales, stock, due-khata, and register
      changes without a manual refresh; an admin-configurable Master
      Security PIN as a second factor for System Reset; and Purchase Order
      generation (print/download/WhatsApp) from the Medicine Orders
      shortage book, grouped by distributor.

      1.2.1: Fixed text/badge contrast across the app that made stock
      levels, expiry warnings, and the Daily Sales Register hard to read,
      and fixed a bug where completing a POS sale with the patient's age
      filled in could fail to generate the bill.

      1.2.0: Updated the UI with a calmer color palette, refreshed
      typography, and a consistent button/card style throughout the app.
      Also adds doctor/stock groups management, a low-stock reorder
      workflow, editable patient records and needed-medicine orders, and a
      forced password-change flow for employee accounts (self-service
      password change, not the old admin-driven reset hack).

      1.1.0: On first launch, create the admin account from a proper
      sign-up screen in the app instead of pre-setting a password via
      environment variable — KINETIRX_ADMIN_PASSWORD is now optional and
      left blank in this manifest.

      1.0.0: Initial CasaOS/ZimaOS release: POS billing, medicine
      inventory, patient records, OPD scheduling, due-khata credit ledger,
      daily sales/cash-drawer reconciliation, expenses, and role-based
      employee accounts.
  website: "https://kinetirx.nodedr.com"
  repo: "https://github.com/Raktim94/KinetiRx"
  support: "https://github.com/Raktim94/KinetiRx/issues"
  docs: "https://github.com/Raktim94/KinetiRx#readme"
