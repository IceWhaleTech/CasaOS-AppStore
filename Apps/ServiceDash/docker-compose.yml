    - arm64
  version: "1.5.1"
  update_at: "2026-08-29"
  author: Chintan Vaghela
  developer: Chintan Vaghela
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ServiceDash/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ServiceDash/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ServiceDash/screenshot-1.jpg
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ServiceDash/screenshot-2.jpg
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ServiceDash/screenshot-3.jpg
  website: https://github.com/cvaghela/service-dash
  repo: https://github.com/cvaghela/service-dash
  docs: https://github.com/cvaghela/service-dash#readme
  support: https://github.com/cvaghela/service-dash/issues
  title:
    en_US: Service Dash
  tagline:
    en_US: 'Every service''s local and public URL on one card, beside the live health of the box running them.'
    en_GB: 'Every service''s local and public URL on one card, beside the live health of the box running them.'
    de_DE: 'Die lokale und die öffentliche URL jedes Dienstes auf einer Karte, daneben der Live-Zustand des Rechners, auf dem sie laufen.'
    el_GR: 'Η τοπική και η δημόσια διεύθυνση κάθε υπηρεσίας σε μία κάρτα, δίπλα στη ζωντανή κατάσταση του μηχανήματος που τις εκτελεί.'
    fr_FR: 'L''URL locale et l''URL publique de chaque service sur une seule carte, à côté de l''état en direct de la machine qui les héberge.'
    hr_HR: 'Lokalni i javni URL svake usluge na jednoj kartici, uz stanje uređaja na kojem rade u stvarnom vremenu.'
    it_IT: 'L''URL locale e quello pubblico di ogni servizio su un''unica scheda, accanto allo stato in tempo reale della macchina che li esegue.'
    ja_JP: '各サービスのローカル URL と公開 URL を 1 枚のカードにまとめ、それらを動かしているマシンの状態をリアルタイムで隣に表示します。'
    ko_KR: '각 서비스의 로컬 URL과 공개 URL을 한 카드에, 그 옆에는 이를 구동하는 장비의 실시간 상태를 함께.'
    nb_NO: 'Hver tjenestes lokale og offentlige URL på ett kort, ved siden av sanntidstilstanden til maskinen som kjører dem.'
    pt_PT: 'O URL local e o público de cada serviço num único cartão, ao lado do estado em tempo real da máquina que os executa.'
    ru_RU: 'Локальный и публичный URL каждого сервиса на одной карточке, рядом — состояние машины, на которой они работают, в реальном времени.'
    sv_SE: 'Varje tjänsts lokala och publika URL på ett kort, bredvid realtidsstatusen för maskinen som kör dem.'
    tr_TR: 'Her servisin yerel ve genel URL''si tek bir kartta, yanında bunları çalıştıran makinenin anlık durumu.'
    zh_CN: '每个服务的局域网地址和公网地址集中在一张卡片上，旁边是运行它们的主机的实时状态。'
  description:
    en_US: |
      Service Dash turns an existing Uptime Kuma status page into a homelab
      dashboard. Each service gets one card carrying both of its addresses --
      the internal (local) URL you use at home and the external (public) URL you
      use away from it -- so you open either one without keeping a second
      bookmark list. Each card opens whichever address the browser you are
      holding can actually reach -- LAN at home, public when you are out --
      decided per card, with a manual switch still there if you want it.

      The pairing comes from Uptime Kuma itself: two monitors named `Plex` and
      `Plex local` become one card with two addresses. Nothing to configure --
      name the monitors that way and the card builds itself.

      Alongside the cards, an embedded Netdata Agent reports the health of the
      host itself: CPU, RAM, storage and live network throughput, plus the
      LAN and WAN addresses of the machine, detected automatically.

      **What it does**

      - Local and public URLs on one card, opening whichever one you can reach
      - Live up/down state pulled straight from your Uptime Kuma status page
      - Host CPU, RAM, storage and network throughput from a bundled Netdata Agent
      - Around 2,900 service icons, searchable, or paste an image link
      - Per-card icon and Docker container mapping, shared across every browser
      - A shared notes panel, gated behind your Uptime Kuma sign-in
      - Addresses stay locked signed out, and unreadable until pointed at signed in
      - Optional: how much of your Claude or ChatGPT plan is left, on the wall
      - No build step, no account, no telemetry -- static files behind nginx

      **Requires an Uptime Kuma instance already running on this host.** See the
      installation tips before installing.

      **Learn more:** [Service Dash on GitHub](https://github.com/cvaghela/service-dash)
    en_GB: |
      Service Dash turns an existing Uptime Kuma status page into a homelab
      dashboard. Each service gets one card carrying both of its addresses --
      the internal (local) URL you use at home and the external (public) URL you
      use away from it -- so you open either one without keeping a second
      bookmark list. Each card opens whichever address the browser you are
      holding can actually reach -- LAN at home, public when you are out --
      decided per card, with a manual switch still there if you want it.

      The pairing comes from Uptime Kuma itself: two monitors named `Plex` and
      `Plex local` become one card with two addresses. Nothing to configure --
      name the monitors that way and the card builds itself.

      Alongside the cards, an embedded Netdata Agent reports the health of the
      host itself: CPU, RAM, storage and live network throughput, plus the
      LAN and WAN addresses of the machine, detected automatically.

      **What it does**

      - Local and public URLs on one card, opening whichever one you can reach
      - Live up/down state pulled straight from your Uptime Kuma status page
      - Host CPU, RAM, storage and network throughput from a bundled Netdata Agent
      - Around 2,900 service icons, searchable, or paste an image link
      - Per-card icon and Docker container mapping, shared across every browser
      - A shared notes panel, gated behind your Uptime Kuma sign-in
      - Addresses stay locked signed out, and unreadable until pointed at signed in
      - Optional: how much of your Claude or ChatGPT plan is left, on the wall
      - No build step, no account, no telemetry -- static files behind nginx

      **Requires an Uptime Kuma instance already running on this host.** See the
      installation tips before installing.

      **Learn more:** [Service Dash on GitHub](https://github.com/cvaghela/service-dash)
    de_DE: |
      Service Dash macht aus einer vorhandenen Uptime-Kuma-Statusseite ein
      Homelab-Dashboard. Jeder Dienst bekommt eine Karte mit beiden Adressen --
      der internen (lokalen) URL für zu Hause und der externen (öffentlichen) URL
      für unterwegs -- sodass Sie beide öffnen können, ohne eine zweite
      Lesezeichenliste zu pflegen. Jede Karte öffnet die Adresse, die der Browser
      in Ihrer Hand tatsächlich erreichen kann -- im LAN die lokale, unterwegs die
      öffentliche -- pro Karte entschieden, mit einem manuellen Schalter, falls
      Sie ihn möchten.

      Die Zuordnung kommt aus Uptime Kuma selbst: Zwei Monitore mit den Namen
      `Plex` und `Plex local` werden zu einer Karte mit zwei Adressen. Nichts zu
      konfigurieren -- benennen Sie die Monitore so, und die Karte entsteht von
      allein.

      Neben den Karten meldet ein eingebetteter Netdata Agent den Zustand des
      Hosts selbst: CPU, RAM, Speicher und den aktuellen Netzwerkdurchsatz, dazu
      die automatisch erkannten LAN- und WAN-Adressen der Maschine.

      **Was es kann**

      - Lokale und öffentliche URL auf einer Karte, geöffnet wird die erreichbare
      - Live-Status direkt von Ihrer Uptime-Kuma-Statusseite
      - CPU, RAM, Speicher und Netzwerkdurchsatz des Hosts über einen mitgelieferten Netdata Agent
      - Rund 2.900 durchsuchbare Dienst-Symbole, oder ein eigener Bildlink
      - Symbol und Docker-Container je Karte, für alle Browser gemeinsam
      - Ein gemeinsames Notizfeld, geschützt durch Ihre Uptime-Kuma-Anmeldung
      - Adressen bleiben abgemeldet gesperrt und angemeldet unlesbar, bis Sie darauf zeigen
      - Optional: wie viel von Ihrem Claude- oder ChatGPT-Kontingent übrig ist, an der Wand
      - Kein Build-Schritt, kein Konto, keine Telemetrie -- statische Dateien hinter nginx

      **Setzt eine bereits laufende Uptime-Kuma-Instanz auf diesem Host voraus.**
      Lesen Sie vor der Installation die Installationshinweise.

      **Mehr erfahren:** [Service Dash auf GitHub](https://github.com/cvaghela/service-dash)
    el_GR: |
      Το Service Dash μετατρέπει μια υπάρχουσα σελίδα κατάστασης του Uptime Kuma
      σε πίνακα ελέγχου για το homelab σας. Κάθε υπηρεσία αποκτά μία κάρτα με
      αμφότερες τις διευθύνσεις της -- την εσωτερική (τοπική) URL που
      χρησιμοποιείτε στο σπίτι και την εξωτερική (δημόσια) URL που χρησιμοποιείτε
      εκτός -- ώστε να ανοίγετε όποια θέλετε χωρίς δεύτερη λίστα σελιδοδεικτών.
      Κάθε κάρτα ανοίγει τη διεύθυνση στην οποία μπορεί πράγματι να φτάσει ο
      browser που κρατάτε -- την τοπική στο LAN, τη δημόσια όταν λείπετε --
      με απόφαση ανά κάρτα και χειροκίνητο διακόπτη αν τον προτιμάτε.

      Η αντιστοίχιση προκύπτει από το ίδιο το Uptime Kuma: δύο monitors με ονόματα
      `Plex` και `Plex local` γίνονται μία κάρτα με δύο διευθύνσεις. Δεν
      ρυθμίζετε τίποτα -- ονομάστε έτσι τα monitors και η κάρτα φτιάχνεται μόνη
      της.

      Δίπλα στις κάρτες, ένας ενσωματωμένος Netdata Agent αναφέρει την κατάσταση
      του ίδιου του host: CPU, RAM, αποθηκευτικό χώρο και ζωντανή ροή δικτύου,
      καθώς και τις διευθύνσεις LAN και WAN του μηχανήματος, εντοπισμένες
      αυτόματα.

      **Τι κάνει**

      - Τοπική και δημόσια URL σε μία κάρτα, ανοίγει όποια είναι προσβάσιμη
      - Ζωντανή κατάσταση απευθείας από τη σελίδα κατάστασης του Uptime Kuma
      - CPU, RAM, αποθήκευση και ροή δικτύου του host από ενσωματωμένο Netdata Agent
      - Περίπου 2.900 εικονίδια υπηρεσιών με αναζήτηση, ή δικός σας σύνδεσμος εικόνας
      - Εικονίδιο και αντιστοίχιση Docker container ανά κάρτα, κοινά για κάθε browser
      - Κοινός πίνακας σημειώσεων, πίσω από τη σύνδεσή σας στο Uptime Kuma
      - Οι διευθύνσεις μένουν κλειδωμένες εκτός σύνδεσης και δυσανάγνωστες μέχρι να τις στοχεύσετε
      - Προαιρετικά: πόσο απομένει από το πλάνο σας σε Claude ή ChatGPT, στον τοίχο
      - Χωρίς βήμα build, χωρίς λογαριασμό, χωρίς τηλεμετρία -- στατικά αρχεία πίσω από nginx

      **Απαιτεί μια ήδη ενεργή εγκατάσταση Uptime Kuma σε αυτόν τον host.**
      Δείτε τις οδηγίες εγκατάστασης πριν προχωρήσετε.

      **Μάθετε περισσότερα:** [Service Dash στο GitHub](https://github.com/cvaghela/service-dash)
    fr_FR: |
      Service Dash transforme une page de statut Uptime Kuma existante en tableau
      de bord pour votre homelab. Chaque service reçoit une carte portant ses deux
      adresses -- l'URL interne (locale) que vous utilisez chez vous et l'URL
      externe (publique) que vous utilisez ailleurs -- pour ouvrir l'une ou
      l'autre sans tenir une seconde liste de favoris. Chaque carte ouvre
      l'adresse que le navigateur entre vos mains peut réellement atteindre --
      locale sur le LAN, publique à l'extérieur -- décidé carte par carte, avec un
      sélecteur manuel si vous le préférez.

      L'appairage vient d'Uptime Kuma lui-même : deux moniteurs nommés `Plex` et
      `Plex local` deviennent une seule carte à deux adresses. Rien à configurer
      -- nommez les moniteurs ainsi et la carte se construit toute seule.

      À côté des cartes, un agent Netdata intégré rapporte l'état de l'hôte
      lui-même : CPU, RAM, stockage et débit réseau en direct, ainsi que les
      adresses LAN et WAN de la machine, détectées automatiquement.

      **Ce qu'il fait**

      - URL locale et publique sur une carte, ouvrant celle que vous pouvez atteindre
      - État en direct, lu directement sur votre page de statut Uptime Kuma
      - CPU, RAM, stockage et débit réseau de l'hôte via un agent Netdata intégré
      - Environ 2 900 icônes de services, avec recherche, ou votre propre lien d'image
      - Icône et conteneur Docker par carte, partagés entre tous les navigateurs
      - Un bloc-notes partagé, protégé par votre connexion Uptime Kuma
      - Les adresses restent verrouillées hors connexion, et illisibles tant qu'on ne les vise pas
      - En option : ce qu'il reste de votre forfait Claude ou ChatGPT, affiché au mur
      - Aucune étape de build, aucun compte, aucune télémétrie -- des fichiers statiques derrière nginx

      **Nécessite une instance Uptime Kuma déjà en service sur cet hôte.**
      Consultez les conseils d'installation avant d'installer.

      **En savoir plus :** [Service Dash sur GitHub](https://github.com/cvaghela/service-dash)
    hr_HR: |
      Service Dash pretvara postojeću Uptime Kuma stranicu stanja u nadzornu ploču
      vašeg homelaba. Svaka usluga dobiva jednu karticu s obje svoje adrese --
      internim (lokalnim) URL-om koji koristite kod kuće i vanjskim (javnim)
      URL-om koji koristite izvan kuće -- pa otvarate bilo koju bez druge liste
      knjižnih oznaka. Svaka kartica otvara onu adresu do koje preglednik u vašoj
      ruci doista može doći -- lokalnu na LAN-u, javnu kad ste vani -- odlučeno po
      kartici, uz ručni prekidač ako ga želite.

      Uparivanje dolazi iz samog Uptime Kume: dva monitora nazvana `Plex` i
      `Plex local` postaju jedna kartica s dvije adrese. Ništa se ne podešava --
      nazovite monitore tako i kartica se izgradi sama.

      Uz kartice, ugrađeni Netdata Agent javlja stanje samog poslužitelja: CPU,
      RAM, prostor za pohranu i propusnost mreže uživo, te LAN i WAN adrese
      uređaja, otkrivene automatski.

      **Što radi**

      - Lokalni i javni URL na jednoj kartici, otvara se onaj koji možete dohvatiti
      - Stanje uživo, izravno s vaše Uptime Kuma stranice stanja
      - CPU, RAM, pohrana i mrežna propusnost poslužitelja preko ugrađenog Netdata Agenta
      - Oko 2.900 ikona usluga s pretraživanjem, ili zalijepite poveznicu na sliku
      - Ikona i pridruženi Docker kontejner po kartici, dijeljeni na svim preglednicima
      - Zajednička ploča s bilješkama, iza vaše Uptime Kuma prijave
      - Adrese ostaju zaključane dok ste odjavljeni i nečitljive dok ih ne pokažete
      - Neobavezno: koliko vam je ostalo od Claude ili ChatGPT plana, na zidu
      - Bez build koraka, bez računa, bez telemetrije -- statične datoteke iza nginxa

      **Zahtijeva Uptime Kuma instancu koja već radi na ovom poslužitelju.**
      Pogledajte savjete za instalaciju prije instaliranja.

      **Saznajte više:** [Service Dash na GitHubu](https://github.com/cvaghela/service-dash)
    it_IT: |
      Service Dash trasforma una pagina di stato Uptime Kuma esistente in una
      dashboard per il vostro homelab. Ogni servizio riceve una scheda con
      entrambi i suoi indirizzi -- l'URL interno (locale) che usate a casa e
      quello esterno (pubblico) che usate fuori -- così da aprire l'uno o l'altro
      senza tenere una seconda lista di segnalibri. Ogni scheda apre l'indirizzo
      che il browser che avete in mano può davvero raggiungere -- quello locale
      sulla LAN, quello pubblico quando siete fuori -- deciso scheda per scheda,
      con un selettore manuale se lo preferite.

      L'abbinamento arriva da Uptime Kuma stesso: due monitor chiamati `Plex` e
      `Plex local` diventano una sola scheda con due indirizzi. Niente da
      configurare -- chiamate così i monitor e la scheda si costruisce da sola.

      Accanto alle schede, un Netdata Agent integrato riporta lo stato dell'host
      stesso: CPU, RAM, spazio di archiviazione e traffico di rete in tempo reale,
      oltre agli indirizzi LAN e WAN della macchina, rilevati automaticamente.

      **Cosa fa**

      - URL locale e pubblico su un'unica scheda, si apre quello raggiungibile
      - Stato in tempo reale, letto direttamente dalla vostra pagina di stato Uptime Kuma
      - CPU, RAM, archiviazione e traffico di rete dell'host tramite un Netdata Agent integrato
      - Circa 2.900 icone di servizi, ricercabili, oppure incollate un link a un'immagine
      - Icona e container Docker per scheda, condivisi fra tutti i browser
      - Un pannello note condiviso, protetto dal vostro accesso a Uptime Kuma
      - Gli indirizzi restano bloccati da disconnessi e illeggibili finché non li puntate
      - Opzionale: quanto resta del vostro piano Claude o ChatGPT, appeso al muro
      - Nessuno step di build, nessun account, nessuna telemetria -- file statici dietro nginx

      **Richiede un'istanza Uptime Kuma già in funzione su questo host.**
      Leggete i suggerimenti di installazione prima di procedere.

      **Per saperne di più:** [Service Dash su GitHub](https://github.com/cvaghela/service-dash)
    ja_JP: |
      Service Dash は、既存の Uptime Kuma ステータスページをホームラボ用の
      ダッシュボードに変えます。各サービスは 1 枚のカードに 2 つのアドレスを
      まとめて持ちます。自宅で使う内部 (ローカル) URL と、外出先で使う外部
      (公開) URL です。ブックマークを 2 つ管理する必要はありません。カードは、
      手元のブラウザーが実際に到達できるほうのアドレスを開きます。LAN 内なら
      ローカル、外出先なら公開アドレスを、カードごとに判断します。手動で切り替える
      スイッチも残してあります。

      ペアリングは Uptime Kuma 自身から来ます。`Plex` と `Plex local` という
      名前の 2 つのモニターが、2 つのアドレスを持つ 1 枚のカードになります。設定は
      不要です。そう名付けるだけで、カードはひとりでに組み上がります。

      カードの隣では、内蔵の Netdata Agent がホスト自身の状態を報告します。CPU、
      メモリー、ストレージ、リアルタイムのネットワーク流量に加えて、自動検出された
      マシンの LAN アドレスと WAN アドレスも表示します。

      **主な機能**

      - ローカル URL と公開 URL を 1 枚のカードに、到達できるほうを開く
      - Uptime Kuma のステータスページから直接読み取る稼働状態
      - 内蔵 Netdata Agent によるホストの CPU、メモリー、ストレージ、ネットワーク流量
      - 約 2,900 種類の検索可能なサービスアイコン、または画像リンクの貼り付け
      - カードごとのアイコンと Docker コンテナーの対応づけを、すべてのブラウザーで共有
      - Uptime Kuma のサインインで保護された共有メモ欄
      - サインアウト中はアドレスをロックし、サインイン後もポインターを合わせるまで判読不能
      - 任意: Claude や ChatGPT のプラン残量を壁に表示
      - ビルド手順なし、アカウントなし、テレメトリーなし -- nginx が配信する静的ファイル

      **このホスト上で Uptime Kuma がすでに稼働している必要があります。**
      インストール前に、インストール時の注意をお読みください。

      **詳しくは:** [GitHub の Service Dash](https://github.com/cvaghela/service-dash)
    ko_KR: |
      Service Dash는 이미 쓰고 있는 Uptime Kuma 상태 페이지를 홈랩 대시보드로
      바꿔 줍니다. 각 서비스는 두 개의 주소를 함께 담은 카드 하나를 갖습니다.
      집에서 쓰는 내부(로컬) URL과 밖에서 쓰는 외부(공개) URL입니다. 덕분에
      북마크 목록을 두 벌 관리할 필요가 없습니다. 카드는 지금 손에 든 브라우저가
      실제로 닿을 수 있는 주소를 엽니다. LAN 안에서는 로컬, 밖에서는 공개 주소를
      카드마다 판단하며, 원한다면 수동 전환 스위치도 그대로 있습니다.

      짝짓기는 Uptime Kuma 자체에서 옵니다. `Plex`와 `Plex local`이라는 이름의
      모니터 두 개가 주소 두 개를 가진 카드 하나가 됩니다. 설정할 것은 없습니다.
      그렇게 이름만 지으면 카드가 알아서 만들어집니다.

      카드 옆에서는 내장된 Netdata Agent가 호스트 자체의 상태를 보고합니다. CPU,
      RAM, 저장 공간, 실시간 네트워크 처리량에 더해 자동으로 감지한 장비의 LAN 및
      WAN 주소까지 보여 줍니다.

      **주요 기능**

      - 로컬 URL과 공개 URL을 한 카드에, 닿을 수 있는 쪽을 열기
      - Uptime Kuma 상태 페이지에서 바로 가져오는 실시간 가동 상태
      - 내장 Netdata Agent가 전하는 호스트 CPU, RAM, 저장 공간, 네트워크 처리량
      - 검색 가능한 약 2,900개의 서비스 아이콘, 또는 이미지 링크 붙여넣기
      - 카드별 아이콘과 Docker 컨테이너 연결을 모든 브라우저에서 공유
      - Uptime Kuma 로그인으로 보호되는 공유 메모 패널
      - 로그아웃 상태에서는 주소가 잠기고, 로그인 후에도 가리키기 전까지 읽을 수 없음
      - 선택 사항: Claude나 ChatGPT 요금제가 얼마나 남았는지 벽에 표시
      - 빌드 단계 없음, 계정 없음, 텔레메트리 없음 -- nginx 뒤의 정적 파일

      **이 호스트에서 Uptime Kuma가 이미 실행 중이어야 합니다.**
      설치하기 전에 설치 안내를 읽어 보세요.

      **더 알아보기:** [GitHub의 Service Dash](https://github.com/cvaghela/service-dash)
    nb_NO: |
      Service Dash gjør en eksisterende Uptime Kuma-statusside om til et
      dashbord for hjemmelaben. Hver tjeneste får ett kort med begge adressene
      sine -- den interne (lokale) URL-en du bruker hjemme og den eksterne
      (offentlige) URL-en du bruker ute -- slik at du åpner hvilken som helst av
      dem uten å holde en bokmerkeliste nummer to. Hvert kort åpner den adressen
      nettleseren du holder faktisk når fram til -- lokal på LAN, offentlig når du
      er ute -- avgjort per kort, med en manuell bryter om du vil ha den.

      Sammenkoblingen kommer fra Uptime Kuma selv: to overvåkere som heter `Plex`
      og `Plex local` blir ett kort med to adresser. Ingenting å konfigurere --
      gi overvåkerne de navnene, så bygger kortet seg selv.

      Ved siden av kortene rapporterer en innebygd Netdata Agent tilstanden til
      verten selv: CPU, RAM, lagring og nettverkstrafikk i sanntid, pluss maskinens
      LAN- og WAN-adresser, funnet automatisk.

      **Hva det gjør**

      - Lokal og offentlig URL på ett kort, åpner den du faktisk når
      - Live oppe/nede-status hentet rett fra Uptime Kuma-statussiden din
      - Vertens CPU, RAM, lagring og nettverkstrafikk fra en medfølgende Netdata Agent
      - Rundt 2 900 søkbare tjenesteikoner, eller lim inn en bildelenke
      - Ikon og Docker-container per kort, delt på tvers av alle nettlesere
      - Et delt notatfelt, beskyttet av Uptime Kuma-innloggingen din
      - Adresser forblir låst når du er logget ut, og uleselige til du peker på dem
      - Valgfritt: hvor mye som er igjen av Claude- eller ChatGPT-abonnementet, på veggen
      - Ingen byggesteg, ingen konto, ingen telemetri -- statiske filer bak nginx

      **Krever en Uptime Kuma-instans som allerede kjører på denne verten.**
      Les installasjonstipsene før du installerer.

      **Les mer:** [Service Dash på GitHub](https://github.com/cvaghela/service-dash)
    pt_PT: |
      O Service Dash transforma uma página de estado do Uptime Kuma já existente
      num painel para o seu homelab. Cada serviço recebe um cartão com os seus
      dois endereços -- o URL interno (local) que usa em casa e o URL externo
      (público) que usa fora -- para abrir qualquer um deles sem manter uma
      segunda lista de marcadores. Cada cartão abre o endereço que o navegador que
      tem na mão consegue realmente alcançar -- o local na LAN, o público quando
      está fora -- decidido cartão a cartão, com um seletor manual se preferir.

      O emparelhamento vem do próprio Uptime Kuma: dois monitores chamados `Plex`
      e `Plex local` tornam-se um único cartão com dois endereços. Nada a
      configurar -- dê esses nomes aos monitores e o cartão constrói-se sozinho.

      Ao lado dos cartões, um Netdata Agent integrado comunica o estado do próprio
      anfitrião: CPU, RAM, armazenamento e débito de rede em tempo real, além dos
      endereços LAN e WAN da máquina, detetados automaticamente.

      **O que faz**

      - URL local e público num só cartão, abrindo aquele que consegue alcançar
      - Estado em tempo real, lido diretamente da sua página de estado do Uptime Kuma
      - CPU, RAM, armazenamento e débito de rede do anfitrião via Netdata Agent integrado
      - Cerca de 2900 ícones de serviços, pesquisáveis, ou cole uma ligação de imagem
      - Ícone e contentor Docker por cartão, partilhados por todos os navegadores
      - Um painel de notas partilhado, protegido pela sua sessão do Uptime Kuma
      - Os endereços ficam bloqueados com sessão terminada e ilegíveis até os apontar
      - Opcional: quanto resta do seu plano Claude ou ChatGPT, na parede
      - Sem passo de compilação, sem conta, sem telemetria -- ficheiros estáticos atrás do nginx

      **Requer uma instância do Uptime Kuma já em execução neste anfitrião.**
      Leia as sugestões de instalação antes de instalar.

      **Saber mais:** [Service Dash no GitHub](https://github.com/cvaghela/service-dash)
    ru_RU: |
      Service Dash превращает уже работающую страницу состояния Uptime Kuma в
      панель управления домашней лабораторией. Каждый сервис получает одну
      карточку с двумя адресами -- внутренним (локальным) URL для дома и внешним
      (публичным) URL для поездок, -- так что открыть можно любой из них, не ведя
      второй список закладок. Карточка открывает тот адрес, до которого браузер в
      ваших руках действительно дотянется: локальный в домашней сети, публичный за
      её пределами. Решение принимается для каждой карточки отдельно, а ручной
      переключатель остаётся на месте, если он вам нужен.

      Связывание берётся из самого Uptime Kuma: два монитора с именами `Plex` и
      `Plex local` становятся одной карточкой с двумя адресами. Настраивать нечего
      -- назовите мониторы так, и карточка соберётся сама.

      Рядом с карточками встроенный Netdata Agent сообщает о состоянии самого
      хоста: загрузка процессора, память, накопители и текущий сетевой трафик, а
      также автоматически определённые адреса машины в локальной сети и во внешней.

      **Что он умеет**

      - Локальный и публичный URL на одной карточке, открывается доступный
      - Состояние в реальном времени прямо со страницы состояния Uptime Kuma
      - Процессор, память, накопители и сетевой трафик хоста от встроенного Netdata Agent
      - Около 2900 значков сервисов с поиском либо ссылка на своё изображение
      - Значок и привязка к контейнеру Docker для каждой карточки, общие для всех браузеров
      - Общая панель заметок, закрытая вашим входом в Uptime Kuma
      - Без входа адреса заблокированы, а после входа нечитаемы, пока на них не наведёшь
      - По желанию: сколько осталось от тарифа Claude или ChatGPT, прямо на стене
      - Без сборки, без аккаунта, без телеметрии -- статические файлы за nginx

      **Требуется уже запущенный на этом хосте экземпляр Uptime Kuma.**
      Перед установкой прочитайте советы по установке.

      **Подробнее:** [Service Dash на GitHub](https://github.com/cvaghela/service-dash)
    sv_SE: |
      Service Dash gör en befintlig statussida i Uptime Kuma till en instrumentpanel
      för ditt homelab. Varje tjänst får ett kort med båda sina adresser -- den
      interna (lokala) URL:en du använder hemma och den externa (publika) URL:en du
      använder borta -- så att du öppnar vilken som helst av dem utan att hålla en
      andra bokmärkeslista. Varje kort öppnar den adress som webbläsaren du håller i
      faktiskt når -- den lokala på LAN, den publika när du är ute -- avgjort per
      kort, med en manuell växel kvar om du vill ha den.

      Parningen kommer från Uptime Kuma självt: två övervakare som heter `Plex` och
      `Plex local` blir ett kort med två adresser. Inget att konfigurera -- döp
      övervakarna så, så bygger kortet sig självt.

      Bredvid korten rapporterar en inbyggd Netdata Agent värdens eget tillstånd:
      processor, minne, lagring och nätverksgenomströmning i realtid, plus maskinens
      LAN- och WAN-adresser, upptäckta automatiskt.

      **Vad den gör**

      - Lokal och publik URL på ett kort, öppnar den du faktiskt når
      - Live-status hämtad direkt från din statussida i Uptime Kuma
      - Värdens processor, minne, lagring och nätverksgenomströmning från en medföljande Netdata Agent
      - Omkring 2 900 sökbara tjänsteikoner, eller klistra in en bildlänk
      - Ikon och Docker-container per kort, delade mellan alla webbläsare
      - En delad anteckningspanel, skyddad av din inloggning i Uptime Kuma
      - Adresser förblir låsta när du är utloggad, och oläsliga tills du pekar på dem
      - Valfritt: hur mycket som är kvar av ditt Claude- eller ChatGPT-abonnemang, på väggen
      - Inget byggsteg, inget konto, ingen telemetri -- statiska filer bakom nginx

      **Kräver en Uptime Kuma-instans som redan körs på den här värden.**
      Läs installationstipsen innan du installerar.

      **Läs mer:** [Service Dash på GitHub](https://github.com/cvaghela/service-dash)
    tr_TR: |
      Service Dash, halihazırda kullandığınız bir Uptime Kuma durum sayfasını ev
      laboratuvarınız için bir panele dönüştürür. Her servis, iki adresini birden
      taşıyan tek bir kart alır: evde kullandığınız dahili (yerel) URL ve dışarıda
      kullandığınız harici (genel) URL. Böylece ikinci bir yer imi listesi tutmadan
      hangisini isterseniz açarsınız. Her kart, elinizdeki tarayıcının gerçekten
      ulaşabildiği adresi açar -- yerel ağdayken yereli, dışarıdayken geneli --
      karar kart bazında verilir ve isterseniz elle geçiş anahtarı da yerinde durur.

      Eşleştirme Uptime Kuma'nın kendisinden gelir: `Plex` ve `Plex local` adlı iki
      izleyici, iki adresli tek bir karta dönüşür. Yapılandıracak bir şey yok --
      izleyicileri böyle adlandırın, kart kendi kendini kurar.

      Kartların yanında, gömülü bir Netdata Agent ana makinenin kendi durumunu
      bildirir: işlemci, bellek, depolama ve anlık ağ trafiği; ayrıca makinenin
      otomatik olarak saptanan yerel ağ ve genel ağ adresleri.

      **Neler yapar**

      - Yerel ve genel URL tek kartta, ulaşabildiğiniz hangisiyse o açılır
      - Doğrudan Uptime Kuma durum sayfanızdan okunan anlık çalışma durumu
      - Gömülü Netdata Agent ile ana makinenin işlemci, bellek, depolama ve ağ trafiği
      - Aranabilir yaklaşık 2.900 servis simgesi ya da yapıştıracağınız bir görsel bağlantısı
      - Kart başına simge ve Docker konteyneri eşlemesi, tüm tarayıcılarda ortak
      - Uptime Kuma oturumunuzun ardına alınmış ortak bir not panosu
      - Adresler oturum kapalıyken kilitli, açıkken de siz üzerine gelene dek okunaksız kalır
      - İsteğe bağlı: Claude veya ChatGPT planınızdan ne kaldığı, duvarda
      - Derleme adımı yok, hesap yok, telemetri yok -- nginx arkasında statik dosyalar

      **Bu ana makinede halihazırda çalışan bir Uptime Kuma örneği gerektirir.**
      Kurmadan önce kurulum ipuçlarını okuyun.

      **Daha fazlası:** [GitHub'da Service Dash](https://github.com/cvaghela/service-dash)
    zh_CN: |
      Service Dash 把你已有的 Uptime Kuma 状态页变成一块家庭实验室仪表盘。每个服务
      对应一张卡片，卡片上同时放着它的两个地址：在家里用的内网（局域网）地址，和
      在外面用的外网（公网）地址。这样你不必再维护第二份书签。卡片会打开你手上这台
      浏览器真正能访问到的那个地址——在家用内网，在外用公网——逐张卡片判断，同时保留
      手动切换开关，随时可以自己选。

      配对关系来自 Uptime Kuma 本身：两个分别叫 `Plex` 和 `Plex local` 的监控项，
      会合成一张带两个地址的卡片。无需任何配置——按这个规则命名监控项，卡片就会自己
      生成。

      在卡片旁边，内置的 Netdata Agent 会报告主机自身的状态：CPU、内存、存储和实时
      网络吞吐，以及自动探测到的本机局域网地址和公网地址。

      **主要功能**

      - 内网与公网地址同在一张卡片上，自动打开你能访问的那个
      - 直接读取 Uptime Kuma 状态页的实时在线状态
      - 内置 Netdata Agent 提供主机的 CPU、内存、存储与网络吞吐
      - 约 2900 个可搜索的服务图标，也可以粘贴自己的图片链接
      - 每张卡片的图标与 Docker 容器映射，在所有浏览器之间共享
      - 一块共享便签板，由你的 Uptime Kuma 登录状态保护
      - 未登录时地址保持锁定，登录后也要指向才能看清
      - 可选：把 Claude 或 ChatGPT 套餐还剩多少显示在墙上
      - 无需构建、无需账号、无遥测——nginx 背后的一组静态文件

      **需要本主机上已经运行着 Uptime Kuma 实例。** 安装前请先阅读安装提示。

      **了解更多：** [GitHub 上的 Service Dash](https://github.com/cvaghela/service-dash)
  tips:
    before_install:
      en_US: |
        ### Before you install

        Service Dash reads your monitors from **Uptime Kuma**. It does not
        install Kuma for you, so set that up first:

        1. Install **Uptime Kuma** from this store, and leave it on its default
           port `3001`. If you run it on another
           port, change `KUMA_PORT` below and `KUMA_URL` on the `kuma-auth`
           service to match. Kuma must be on this same host.
        2. In Uptime Kuma, create a **status page** and add the monitors you
           want on the dashboard.
        3. Note the status page's **slug** -- the last part of its URL. If it is
           not `homelab`, change `STATUS_SLUG` below to match.

        ### Getting local and public URLs on one card

        Both addresses come from Uptime Kuma, from **how you name the
        monitors**. Give a service two monitors:

        | Monitor name | Points at | Shows on the card as |
        | --- | --- | --- |
        | `Plex` | your public URL | **External** |
        | `Plex local` | your LAN URL | **Local** |

        Service Dash pairs them by name into a single card carrying both.
        `Plex (local)`, `Plex - local` and `Plex.local` are recognised the same
        way. A service with only one monitor simply shows one address.

        Each address is the monitor's own URL in Kuma, so it is set in Kuma, not
        here. The dashboard opens whichever address your browser can actually
        reach -- the local one when you are on the LAN, the public one when you
        are not -- deciding per card and without testing anything. The switch in
        the top bar pins it to **Local** or **External** if you would rather
        choose yourself.

        Both addresses read **URL Locked** until you sign in to Uptime Kuma from
        the dashboard -- signed out, they are never sent to the browser at all.

        Then open Service Dash on port **8888**.
