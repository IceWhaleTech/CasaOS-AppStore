name: service-dash

services:
  service-dash:
    image: ghcr.io/cvaghela/service-dash:1.5.1
    container_name: service-dash
    ports:
      - target: 80
        published: "8888"
        protocol: tcp
    environment:
      # The port Uptime Kuma listens on, on this host.
      KUMA_PORT: "3001"
      # The slug of the Uptime Kuma status page to read monitors from.
      STATUS_SLUG: "homelab"
      STORAGE_MOUNT: "auto"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - netdata
      - docker-metadata
      - network-info
      - kuma-auth
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /var/run/network-info
        read_only: true
      # Written by the optional claude-usage reporter. Absent unless that
      # profile is running, which nginx handles by 404ing the route.
      - type: bind
        source: /DATA/AppData/service-dash/ai-usage
        target: /var/run/ai-usage
        read_only: true
      # Holds shared card settings. Only written when SHARED_SETTINGS is "on".
      - type: bind
        source: /DATA/AppData/service-dash/settings
        target: /var/lib/service-dash
    networks:
      service-dash-network:
        aliases:
          - service-dash
    restart: unless-stopped
    # Service-level x-casaos is legacy: the v2 build strips it. It is kept for
    # the official store, which still packages a v1 main.zip for older clients,
    # and it documents the three settings worth changing at install time.
    x-casaos:
      envs:
        - container: KUMA_PORT
          description:
            en_US: The port Uptime Kuma listens on, on this host. Default 3001.
        - container: STATUS_SLUG
          description:
            en_US: The slug of the Uptime Kuma status page to read monitors from.
        - container: STORAGE_MOUNT
          description:
            en_US: Which filesystem the storage gauge reports. "auto" picks the largest data mount.

  # Answers one question for nginx: is this browser really signed in to Uptime
  # Kuma? Without it, saving settings would have to trust the browser's word.
  kuma-auth:
    image: ghcr.io/cvaghela/service-dash-kuma-auth:1.5.1
    container_name: service-dash-kuma-auth
    environment:
      # Must point at the same Uptime Kuma as KUMA_PORT above.
      KUMA_URL: "http://host.docker.internal:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Must share a network with service-dash: nginx reaches this by service name.
    networks:
      service-dash-network:
        aliases:
          - kuma-auth
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:2371/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  network-info:
    image: ghcr.io/cvaghela/service-dash-network-info:1.5.1
    container_name: service-dash-network-info
    network_mode: host
    read_only: true
    environment:
      # Starting value only -- the dashboard's settings page overrides it.
      NETWORK_INFO_REFRESH_SECONDS: "600"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /status
      # Read-only: the refresh interval is set on the dashboard's settings page.
      - type: bind
        source: /DATA/AppData/service-dash/settings
        target: /settings
        read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-s", "/status/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  docker-metadata:
    image: ghcr.io/hectorm/cetusguard:v1
    container_name: service-dash-docker-metadata
    read_only: true
    environment:
      CETUSGUARD_BACKEND_ADDR: unix:///var/run/docker.sock
      CETUSGUARD_FRONTEND_ADDR: tcp://0.0.0.0:2375
      # Read-only, and only the two network endpoints the dashboard needs.
      CETUSGUARD_RULES: |
        GET %API_PREFIX_NETWORKS%(\?.*)?
        GET %API_PREFIX_NETWORKS%/%NETWORK_ID_OR_NAME%(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      service-dash-network:
        aliases:
          - docker-metadata
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable
    container_name: service-dash-netdata
    pid: host
    environment:
      DISABLE_TELEMETRY: "1"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /DATA/AppData/service-dash/netdata/config:/etc/netdata
      - /DATA/AppData/service-dash/netdata/lib:/var/lib/netdata
      - /DATA/AppData/service-dash/netdata/cache:/var/cache/netdata
      # The whole host root, read-only. Binding only /DATA here left Netdata
      # unable to walk the host's mount table, so its disk collector reported
      # the container's own root and nothing else -- which is why the storage
      # picker offered a single "/" on ZimaOS. Netdata reads sizes, it never
      # writes, and rslave keeps later host mounts visible.
      - /:/host/root:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    networks:
      service-dash-network:
        aliases:
          - netdata
    restart: unless-stopped

  # Reports your Claude plan usage to the dashboard panel.
  #
  # Runs always, and does nothing until you sign in: with no credential it
  # writes an honest "nobody has signed in yet" document, the panel stays
  # hidden, and it costs about 6MB of RAM and no measurable CPU.
  #
  # It used to sit behind a Compose profile so it started for nobody. That was
  # the wrong mechanism: a CasaOS app update rewrites image tags but does NOT
  # add services a release introduced, so profile-gated services never reached
  # anyone upgrading -- and the enable command the settings page printed found
  # nothing to start. Shipping it present-but-idle makes "enable" a sign-in.
  #
  # The trade is the image size, which is large because it carries Claude Code.
  # `docker compose stop claude-usage` if you never want it.
  #
  #   docker exec -it service-dash-claude-usage claude auth login
  claude-usage:
    image: ghcr.io/cvaghela/service-dash-claude-usage:1.5.1
    container_name: service-dash-claude-usage
    environment:
      # Plan windows move slowly; polling harder gains nothing.
      CLAUDE_USAGE_REFRESH_SECONDS: "300"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/ai-usage
        target: /status
      # The login. Without this a container rebuild signs you out.
      - type: bind
        source: /DATA/AppData/service-dash/claude-auth
        target: /root/.claude
    networks:
      service-dash-network:
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Reports your Codex plan usage to the dashboard panel. Same deal as
  # claude-usage above: always present, idle until you sign in.
  #
  # One-time sign-in, after starting it. --device-auth is not optional in a
  # container: the default flow opens a browser at the container's own
  # localhost and hangs.
  #   docker exec -it service-dash-codex-usage codex login --device-auth
  codex-usage:
    image: ghcr.io/cvaghela/service-dash-codex-usage:1.5.1
    container_name: service-dash-codex-usage
    environment:
      CODEX_USAGE_REFRESH_SECONDS: "300"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/ai-usage
        target: /status
      - type: bind
        source: /DATA/AppData/service-dash/codex-auth
        target: /root/.codex
    networks:
      service-dash-network:
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  service-dash-network:
    name: service-dash-network
    driver: bridge

