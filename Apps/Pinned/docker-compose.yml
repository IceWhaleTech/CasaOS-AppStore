name: pinned
services:
  pinned:
    image: ghcr.io/pinned-cc/pinned:0.1.10@sha256:cf19c3cc2fea817a85ea28e47e587baf36d38188242ead118b559d84470a4c2a
    container_name: pinned
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - target: 8080
        published: "9095"
        protocol: tcp
    environment:
      APP_PASSWORD: ""
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    # The app writes only to /data; everything else stays read only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: APP_PASSWORD
          description:
            en_US: The login password, at least 8 characters. Pinned does not start without it.
        - container: TZ
          description:
            en_US: Time zone for the nightly export at 03:00.
      ports:
        - container: "8080"
          description:
            en_US: Web interface
      volumes:
        - container: /data
          description:
            en_US: The SQLite database and the nightly exports
x-casaos:
  id: cc.pinned.pinned
  main: pinned
  index: /
  port_map: "9095"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Pinned/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Pinned/screenshot-1.png
  title:
    en_US: Pinned
  tagline:
    en_US: Bookmarks and a start page for the services you run at home
  description:
    en_US: |-
      A self-hosted bookmark manager and start page for one person. Folders instead of tags, one password, one SQLite file.

      Links to services on your network are kept apart by host and port, so two apps on one address with different ports are two bookmarks, and the port is always shown.

      Save with the Save button (a bookmarklet), as a home screen app on the phone, from the Android share sheet, with the browser extension, or from scripts with an API token. Import and export use the bookmarks file every browser reads, and a copy is written to the data folder every night at 03:00.

      The server contacts only the sites you save, to fetch their icons. No telemetry, no update checks.
  tips:
    before_install:
      en_US: Set APP_PASSWORD to a password of at least 8 characters before you install. Pinned does not start without it. Put HTTPS in front before you use it from outside your network.
  author: Pinned
  developer: Pinned
  category: Productivity
  architectures:
    - amd64
    - arm64
  version: "0.1.10"
  update_at: "2026-10-28"
  release_notes:
    en_US: In light mode on the phone, the selected tab no longer carries a heavy dark shadow. It now has a thin edge and a soft shadow, like the rest of light mode.
  website: https://pinned.cc
  repo: https://github.com/pinned-cc/pinned
  support: https://github.com/pinned-cc/pinned/issues
