name: akou

services:
  # The server runs as uid 1000 and stops with exit 77 when /data or /models is
  # not writable by it. CasaOS creates the bind folders as root, so this one-shot
  # service hands them to uid 1000 before akou starts.
  akou-init:
    image: drumsergio/akou:1.0.0
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown 1000:1000 /data /models
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
      - type: bind
        source: /DATA/AppData/$AppID/models
        target: /models
    restart: "no"

  akou:
    image: drumsergio/akou:1.0.0
    container_name: akou
    deploy:
      resources:
        reservations:
          memory: 2G
    restart: unless-stopped
    depends_on:
      akou-init:
        condition: service_completed_successfully
    ports:
      - target: 8476
        published: "8476"
        protocol: tcp
    environment:
      AKOU_BEHIND_PROXY: "true"
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
      - type: bind
        source: /DATA/AppData/$AppID/models
        target: /models
    x-casaos:
      envs:
        - container: AKOU_BEHIND_PROXY
          description:
            en_US: akou has no TLS of its own and refuses to listen on the network until this is true. Keep it on a trusted network, or put a reverse proxy with TLS in front.
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8476"
          description:
            en_US: Web UI and API port
          protocol: tcp
      volumes:
        - container: /data
          description:
            en_US: Settings, API keys and jobs
        - container: /models
          description:
            en_US: Speech models, downloaded on first use (about 3 GB)

x-casaos:
  id: org.icewhale.akou
  architectures:
    - amd64
    - arm64
  main: akou
  author: GeiserX
  developer: GeiserX
  category: AI
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/akou/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/akou/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/akou/screenshot-2.png
  title:
    en_US: akou
  tagline:
    en_US: Self-hosted transcription server with speaker labels and an OpenAI-compatible API
  description:
    en_US: |
      akou turns audio into text on your own server. A program uploads a file, gets a job id back at once, and reads the result with text, language, word and segment times and speaker labels, by long-poll, by an event feed or by a signed webhook. It also answers the OpenAI transcription endpoint (`POST /v1/audio/transcriptions`), so clients that speak it work with no code on their side.

      Results come as text, JSON, SRT or VTT. Each program gets its own API key, and a web page shows the job queue, the keys, the models and the settings. Nothing leaves the box: there is no akou cloud and no relay.

      The default `fast` preset runs NVIDIA Parakeet TDT 0.6B v3 on the CPU, with Nemotron speaker labels when a job asks for them. The models download on first use, about 3 GB.

      akou is also a call recorder for macOS; this app is its server mode, the same core in Docker.
  tips:
    before_install:
      en_US: |
        akou has no TLS of its own. This app sets `AKOU_BEHIND_PROXY` to true so that it listens on your network over plain HTTP. Keep it on a trusted network, or put a reverse proxy with TLS in front before you reach it from outside.

        The first job downloads the speech models into the models folder, about 3 GB, so it waits a few minutes for that.

        The web page asks for an admin password. Set one from a shell on this box after the install, with at least 12 characters:

        `printf '%s' 'your-password' | docker exec -i akou akou admin set-password`

        Then log in and create one API key per program on the Keys page. A key is shown once; give it to the program as its bearer token.
  index: /
  port_map: "8476"
  scheme: http
  version: "1.0.0"
  update_at: "2026-10-10"
  release_notes:
    en_US: |-
      - First version in the store, on akou 1.0.0.
  website: https://geiserx.github.io/akou/server/
  repo: https://github.com/GeiserX/akou
  support: https://github.com/GeiserX/akou/issues
  docs: https://geiserx.github.io/akou/server/
