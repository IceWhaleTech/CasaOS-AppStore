  tips:
    before_install:
      en_US: |
        ⚠️ Warning!
        This is a technical app, please make sure you know what you are doing.
        Corvus occupies ports 80 and 443 by default for the sites it proxies. It occupies port 9443 for the admin console.
        Please change the CasaOS WebUI port to a port other than 80/443/9443. And pay attention to whether the ports conflict with other apps (for example Nginx Proxy Manager). Otherwise, it may cause your CasaOS to run abnormally.

        First run

        The console uses HTTPS with a self-signed certificate. Open `https://<your-device-ip>:9443`, and accept the browser warning. Enter the one-time setup token from the app logs (the line with `setup_token`), then create the administrator account. There is no default password.

        TCP/UDP streams listen on ports you choose, so add a port mapping for each stream in the app settings.
      zh_CN: |
        ⚠️ 警告！
        这是一个技术类应用，请确保你知道你在做什么。
        Corvus 默认占用 80 和 443 端口给代理的站点使用。占用 9443 端口给管理控制台。
        请将 CasaOS WebUI 端口改为非 80/443/9443 的端口。并注意是否与其他应用（例如 Nginx Proxy Manager）冲突。否则可能导致你的 CasaOS 运行异常。

        首次运行

        控制台使用带自签名证书的 HTTPS。打开 `https://<设备 IP>:9443`，接受浏览器警告。输入应用日志中的一次性设置令牌（包含 `setup_token` 的那一行），然后创建管理员账户。没有默认密码。

        TCP/UDP 流监听你自行选择的端口，请在应用设置中为每个流添加端口映射。
      ko_KR: |
        ⚠️ 주의!
        기술적인 앱입니다. 무엇을 하는지 알고 설치해 주세요.
        Corvus는 기본적으로 프록시하는 사이트용으로 80, 443 포트를, 관리 콘솔용으로 9443 포트를 사용합니다.
        CasaOS WebUI 포트를 80/443/9443이 아닌 포트로 변경해 주세요. 다른 앱(예: Nginx Proxy Manager)과 포트가 겹치지 않는지도 확인해 주세요. 그렇지 않으면 CasaOS가 정상적으로 동작하지 않을 수 있습니다.

        첫 실행

        콘솔은 자체 서명 인증서를 쓰는 HTTPS입니다. `https://<기기 IP>:9443`에 접속해 브라우저 경고를 수락하세요. 앱 로그에서 일회용 설정 토큰(`setup_token`이 있는 줄)을 찾아 입력한 뒤 관리자 계정을 만드세요. 기본 비밀번호는 없습니다.

        TCP/UDP 스트림은 직접 정한 포트에서 수신하므로, 스트림마다 앱 설정에서 포트 매핑을 추가해 주세요.
  title:
    en_US: Corvus
    zh_CN: Corvus
  index: /
  port_map: "9443"
  scheme: https
  version: "1.1.1"
  update_at: "2026-11-05"
  release_notes:
    en_US: |-
      - Saved DNS credentials: enter a DNS provider token once and reuse it for every DNS-01 certificate. Tokens saved per certificate in older versions are moved over automatically on upgrade.
      - Unknown hosts: choose what Corvus answers for host names it does not serve: a 404 page, close the connection, or redirect to a URL.
      - Console host guard: the proxy host the console is opened through is marked, and disabling or deleting it asks first.
      - Fixes: security rules in Log mode no longer count toward automatic bans; the first-run setup form is readable in dark mode.
    zh_CN: |-
      - 保存的 DNS 凭据：只需输入一次 DNS 服务商令牌，即可用于所有 DNS-01 证书。旧版本中按证书保存的令牌会在升级时自动迁移。
      - 未知主机：可选择对未配置的主机名返回 404 页面、关闭连接或重定向到指定 URL。
      - 控制台主机保护：标记用于打开控制台的代理主机，禁用或删除前会先确认。
      - 修复：日志模式下的安全规则不再计入自动封禁；首次设置表单在深色模式下可正常阅读。
    ko_KR: |-
      - DNS 자격 증명 저장: DNS 제공자 토큰을 한 번 입력하면 모든 DNS-01 인증서에 재사용합니다. 이전 버전에서 인증서별로 저장된 토큰은 업그레이드 시 자동으로 옮겨집니다.
      - 알 수 없는 호스트: 서비스하지 않는 호스트 이름에 404 페이지, 연결 종료, URL 리디렉션 중 어떻게 응답할지 선택할 수 있습니다.
      - 콘솔 호스트 보호: 콘솔에 접속 중인 프록시 호스트를 표시하고, 비활성화하거나 삭제할 때 먼저 확인합니다.
      - 수정: 로그 모드의 보안 규칙이 더 이상 자동 차단에 집계되지 않으며, 첫 실행 설정 화면이 다크 모드에서도 잘 보입니다.
