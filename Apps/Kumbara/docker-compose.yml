name: armanckeser-kumbara
services:
  app:
    image: ghcr.io/armanckeser/kumbara:0.22.0
    container_name: armanckeser-kumbara-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres@armanckeser-kumbara-postgres:5432/app
      ELECTRIC_URL: http://armanckeser-kumbara-electric:3000
      AUTH_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_started
    ports:
      - target: 8080
        published: "5182"
        protocol: tcp
    x-casaos:
      envs:
        - container: AUTH_PASSWORD
          description:
            en_US: Password for the app (leave empty for no login). Set one if anyone else on your network can reach this server.
      ports:
        - container: "8080"
          description:
            en_US: Web UI
  postgres:
    image: postgres:16-alpine
    container_name: armanckeser-kumbara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      # Postgres is reachable only on this app's own network, so it runs without a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/pgdata
        target: /var/lib/postgresql/data
  electric:
    image: electricsql/electric:1.7.6
    container_name: armanckeser-kumbara-electric
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:@armanckeser-kumbara-postgres:5432/app?sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_STORAGE_DIR: /var/lib/electric/persistent
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/electricdata
        target: /var/lib/electric/persistent
x-casaos:
  id: com.armanckeser.kumbara
  architectures:
    - amd64
    - arm64
  main: app
  author: Armanc Keser
  developer: Armanc Keser
  category: Finance
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Kumbara/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Kumbara/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Kumbara/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Kumbara/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Kumbara/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Kumbara/screenshot-4.png
  title:
    en_US: Kumbara
  tagline:
    en_US: Budgeting that files your bank feed for you and opens instantly on your phone.
  description:
    en_US: |-
      Kumbara pulls your bank transactions through SimpleFIN and files what it recognizes. For the rest it asks once per merchant, and one answer covers every charge from that merchant. Transfers between your own accounts are paired, so they never count as spending.

      The budget is Needs, Wants and Savings, with what is left per day. It also tracks stock grants, investments, and paychecks from gross to net.

      Kumbara is a phone app you install from the browser. Every screen loads from data already on your phone, so it opens instantly. Connect your bank from the app with a SimpleFIN setup token (SimpleFIN costs about $15 a year, paid to them). Single household.
  tips:
    before_install:
      en_US: Set AUTH_PASSWORD if anyone else on your network can reach this server; leave it empty for no login.
  index: /
  port_map: "5182"
  scheme: http
  version: 0.22.0
  update_at: 2026-10-24
  release_notes:
    en_US: |-
      - Kumbara now installs from the app stores of Cosmos, Umbrel, CasaOS/ZimaOS, Runtipi, Unraid and Portainer, through https://github.com/armanckeser/selfhost-apps. Or with one command and no checkout: `docker compose -f oci://ghcr.io/armanckeser/kumbara-stack:latest up -d`.
      - One container serves the app and its API on port 8080, for amd64 and arm64. An all-in-one image (`ghcr.io/armanckeser/kumbara:aio`) puts the database in the same container, for Unraid and `docker run`.
      - Nothing to set up by hand: migrations, the Web Push keys and the session key are created on first start.
      - Password sign-in (`AUTH_PASSWORD`) for servers without an OIDC provider. OIDC sign-in works as before.
      - Stock grants: patching a grant checks the account, and vesting uses your local day.

      Includes migration 280 (instance_secret), applied automatically when the app starts.
  website: https://github.com/armanckeser/kumbara
  repo: https://github.com/armanckeser/kumbara
  support: https://github.com/armanckeser/kumbara/issues
