  description:
    en_US: |-
      llama.cpp is a pure C/C++ inference engine for GGUF large language models, with the official OpenAI-compatible server and a built-in Web UI.

      **Key Features:**
      - Run GGUF models (Llama, Qwen, DeepSeek, Gemma, Mistral and more) on CPU or GPU
      - Vulkan backend works on AMD / Intel / NVIDIA GPUs out of the box
      - Great fit for unified-memory machines (e.g. AMD Ryzen AI Max 395)
      - OpenAI-compatible API for integration with Open WebUI, ChatGPT-Next-Web and more
      - Built-in chat Web UI with runtime model loading

      **Getting started:**
      1. Put GGUF model files into the models volume (`/models`)
      2. Open the Web UI at `http://<zima-ip>:18080` and load a model
      3. Keep `/dev/dri` mapped for Vulkan acceleration; remove it for CPU-only mode
    en_GB: |-
      llama.cpp is a pure C/C++ inference engine for GGUF large language models, with the official OpenAI-compatible server and a built-in Web UI.

      **Key Features:**
      - Run GGUF models (Llama, Qwen, DeepSeek, Gemma, Mistral and more) on CPU or GPU
      - Vulkan backend works on AMD / Intel / NVIDIA GPUs out of the box
      - Great fit for unified-memory machines (e.g. AMD Ryzen AI Max 395)
      - OpenAI-compatible API for integration with Open WebUI, ChatGPT-Next-Web and more
      - Built-in chat Web UI with runtime model loading

      **Getting started:**
      1. Put GGUF model files into the models volume (`/models`)
      2. Open the Web UI at `http://<zima-ip>:18080` and load a model
      3. Keep `/dev/dri` mapped for Vulkan acceleration; remove it for CPU-only mode
    zh_CN: |-
      llama.cpp 是一个纯 C/C++ 编写的大语言模型推理引擎，专为 GGUF 格式模型优化，自带 OpenAI 兼容 API 服务器和内置 Web 界面。

      **主要特点：**
      - 支持在 CPU 或 GPU 上运行 GGUF 模型（Llama、Qwen、DeepSeek、Gemma、Mistral 等）
      - Vulkan 后端开箱即用，兼容 AMD / Intel / NVIDIA 显卡
      - 非常适合统一内存架构机型（如 AMD Ryzen AI Max 395）
      - 提供 OpenAI 兼容 API，可对接 Open WebUI、ChatGPT-Next-Web 等
      - 内置聊天 Web 界面，支持运行时加载模型

      **快速上手：**
      1. 将 GGUF 模型文件放入模型目录（`/models`）
      2. 浏览器打开 `http://<Zima 的 IP>:18080`，在界面中加载模型
      3. 保留 `/dev/dri` 映射以启用 Vulkan 加速；纯 CPU 模式请移除该映射
    zh_TW: |-
      llama.cpp 是一個純 C/C++ 撰寫的大型語言模型推論引擎，專為 GGUF 格式模型最佳化，內建 OpenAI 相容 API 伺服器與網頁介面。

      **主要特色：**
      - 支援在 CPU 或 GPU 上執行 GGUF 模型（Llama、Qwen、DeepSeek、Gemma、Mistral 等）
      - Vulkan 後端開箱即用，相容 AMD / Intel / NVIDIA 顯示卡
      - 非常適合統一記憶體架構機型（如 AMD Ryzen AI Max 395）
      - 提供 OpenAI 相容 API，可介接 Open WebUI、ChatGPT-Next-Web 等
      - 內建聊天網頁介面，支援執行階段載入模型

      **快速上手：**
      1. 將 GGUF 模型檔案放入模型目錄（`/models`）
      2. 以瀏覽器開啟 `http://<Zima 的 IP>:18080`，在介面中載入模型
      3. 保留 `/dev/dri` 映射以啟用 Vulkan 加速；純 CPU 模式請移除該映射
    de_DE: |-
      llama.cpp ist eine reine C/C++-Inferenz-Engine für große Sprachmodelle im GGUF-Format, mit dem offiziellen OpenAI-kompatiblen Server und einer integrierten Web-Oberfläche.

      **Hauptfunktionen:**
      - GGUF-Modelle (Llama, Qwen, DeepSeek, Gemma, Mistral u. a.) auf CPU oder GPU ausführen
      - Vulkan-Backend funktioniert sofort mit AMD-, Intel- und NVIDIA-GPUs
      - Ideal für Maschinen mit Unified Memory (z. B. AMD Ryzen AI Max 395)
      - OpenAI-kompatible API zur Anbindung von Open WebUI, ChatGPT-Next-Web u. a.
      - Integrierte Chat-Web-Oberfläche mit Modell-Laden zur Laufzeit

      **Erste Schritte:**
      1. GGUF-Modelldateien in das Modell-Volume legen (`/models`)
      2. Web-Oberfläche unter `http://<zima-ip>:18080` öffnen und ein Modell laden
      3. `/dev/dri` für Vulkan-Beschleunigung beibehalten; für reinen CPU-Betrieb entfernen
    fr_FR: |-
      llama.cpp est un moteur d'inférence en pur C/C++ pour grands modèles de langage au format GGUF, avec le serveur officiel compatible OpenAI et une interface Web intégrée.

      **Fonctionnalités clés :**
      - Exécute des modèles GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral, etc.) sur CPU ou GPU
      - Le backend Vulkan fonctionne nativement sur les GPU AMD / Intel / NVIDIA
      - Parfait pour les machines à mémoire unifiée (ex. AMD Ryzen AI Max 395)
      - API compatible OpenAI pour Open WebUI, ChatGPT-Next-Web, etc.
      - Interface Web de chat intégrée avec chargement de modèles à la volée

      **Pour commencer :**
      1. Placez les fichiers de modèles GGUF dans le volume des modèles (`/models`)
      2. Ouvrez l'interface Web sur `http://<zima-ip>:18080` et chargez un modèle
      3. Conservez `/dev/dri` pour l'accélération Vulkan ; retirez-le pour un mode CPU seul
    es_ES: |-
      llama.cpp es un motor de inferencia en C/C++ puro para grandes modelos de lenguaje GGUF, con el servidor oficial compatible con OpenAI y una interfaz web integrada.

      **Características clave:**
      - Ejecuta modelos GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral, etc.) en CPU o GPU
      - El backend Vulkan funciona de serie en GPU AMD / Intel / NVIDIA
      - Ideal para equipos con memoria unificada (p. ej. AMD Ryzen AI Max 395)
      - API compatible con OpenAI para Open WebUI, ChatGPT-Next-Web, etc.
      - Interfaz web de chat integrada con carga de modelos en tiempo de ejecución

      **Cómo empezar:**
      1. Coloque los archivos de modelo GGUF en el volumen de modelos (`/models`)
      2. Abra la interfaz web en `http://<zima-ip>:18080` y cargue un modelo
      3. Mantenga `/dev/dri` para la aceleración Vulkan; quítelo para el modo solo CPU
    it_IT: |-
      llama.cpp è un motore di inferenza in puro C/C++ per grandi modelli linguistici GGUF, con il server ufficiale compatibile con OpenAI e un'interfaccia web integrata.

      **Funzionalità principali:**
      - Esegue modelli GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral e altri) su CPU o GPU
      - Il backend Vulkan funziona subito su GPU AMD / Intel / NVIDIA
      - Ottimo per macchine a memoria unificata (es. AMD Ryzen AI Max 395)
      - API compatibile con OpenAI per Open WebUI, ChatGPT-Next-Web e altro
      - Interfaccia web di chat integrata con caricamento dei modelli a runtime

      **Per iniziare:**
      1. Mettere i file modello GGUF nel volume dei modelli (`/models`)
      2. Aprire l'interfaccia web su `http://<zima-ip>:18080` e caricare un modello
      3. Mantenere `/dev/dri` per l'accelerazione Vulkan; rimuoverlo per la modalità solo CPU
    ja_JP: |-
      llama.cpp は GGUF 形式の大規模言語モデル向けの純粋な C/C++ 推論エンジンで、公式の OpenAI 互換サーバーと内蔵 Web UI を備えています。

      **主な機能：**
      - GGUF モデル（Llama、Qwen、DeepSeek、Gemma、Mistral など）を CPU または GPU で実行
      - Vulkan バックエンドは AMD / Intel / NVIDIA の GPU ですぐに動作
      - ユニファイドメモリ搭載機（例: AMD Ryzen AI Max 395）に最適
      - Open WebUI、ChatGPT-Next-Web などと連携できる OpenAI 互換 API
      - モデルを実行時に読み込める内蔵チャット Web UI

      **使い始める：**
      1. GGUF モデルファイルをモデル用ボリューム（`/models`）に配置
      2. `http://<zima-ip>:18080` で Web UI を開き、モデルを読み込む
      3. Vulkan 加速には `/dev/dri` のマッピングを維持。CPU のみの場合は削除
    ko_KR: |-
      llama.cpp는 GGUF 대형 언어 모델을 위한 순수 C/C++ 추론 엔진으로, 공식 OpenAI 호환 서버와 내장 웹 UI를 제공합니다.

      **주요 기능:**
      - GGUF 모델(Llama, Qwen, DeepSeek, Gemma, Mistral 등)을 CPU 또는 GPU에서 실행
      - Vulkan 백엔드가 AMD / Intel / NVIDIA GPU에서 바로 동작
      - 통합 메모리 기기(예: AMD Ryzen AI Max 395)에 최적
      - Open WebUI, ChatGPT-Next-Web 등과 연동 가능한 OpenAI 호환 API
      - 런타임 모델 로딩을 지원하는 내장 채팅 웹 UI

      **시작하기:**
      1. GGUF 모델 파일을 모델 볼륨(`/models`)에 넣기
      2. `http://<zima-ip>:18080`에서 웹 UI를 열고 모델 로드
      3. Vulkan 가속을 위해 `/dev/dri` 매핑 유지. CPU 전용 모드에서는 제거
    ru_RU: |-
      llama.cpp — это движок логического вывода на чистом C/C++ для больших языковых моделей в формате GGUF, с официальным сервером, совместимым с OpenAI, и встроенным веб-интерфейсом.

      **Ключевые возможности:**
      - Запуск GGUF-моделей (Llama, Qwen, DeepSeek, Gemma, Mistral и др.) на CPU или GPU
      - Бэкенд Vulkan работает «из коробки» на GPU AMD / Intel / NVIDIA
      - Отлично подходит для машин с унифицированной памятью (например, AMD Ryzen AI Max 395)
      - API, совместимый с OpenAI, для Open WebUI, ChatGPT-Next-Web и др.
      - Встроенный чат-веб-интерфейс с загрузкой моделей во время работы

      **Начало работы:**
      1. Поместите GGUF-файлы моделей в том моделей (`/models`)
      2. Откройте веб-интерфейс по адресу `http://<zima-ip>:18080` и загрузите модель
      3. Оставьте `/dev/dri` для ускорения Vulkan; удалите для режима только CPU
    pt_BR: |-
