    tr_TR: |-
      llama.cpp, GGUF büyük dil modelleri için saf C/C++ çıkarım motorudur; resmi OpenAI uyumlu sunucu ve yerleşik web arayüzü içerir.

      **Öne çıkan özellikler:**
      - GGUF modellerini (Llama, Qwen, DeepSeek, Gemma, Mistral ve fazlası) CPU veya GPU üzerinde çalıştırın
      - Vulkan arka ucu AMD / Intel / NVIDIA GPU'larda kutudan çıktığı gibi çalışır
      - Birleşik belleğe sahip makineler için idealdir (örn. AMD Ryzen AI Max 395)
      - Open WebUI, ChatGPT-Next-Web ve daha fazlası için OpenAI uyumlu API
      - Çalışma zamanında model yüklemeli yerleşik sohbet web arayüzü

      **Başlarken:**
      1. GGUF model dosyalarını model birimine koyun (`/models`)
      2. Web arayüzünü `http://<zima-ip>:18080` adresinde açın ve bir model yükleyin
      3. Vulkan hızlandırma için `/dev/dri` eşlemesini koruyun; yalnızca CPU modu için kaldırın
    el_GR: |-
      Το llama.cpp είναι μια αμιγής μηχανή εξαγωγής συμπερασμάτων σε C/C++ για μεγάλα γλωσσικά μοντέλα GGUF, με τον επίσημο διακομιστή συμβατό με OpenAI και ενσωματωμένο περιβάλλον ιστού.

      **Βασικά χαρακτηριστικά:**
      - Εκτελέστε μοντέλα GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral κ.ά.) σε CPU ή GPU
      - Το backend Vulkan λειτουργεί άμεσα σε GPU AMD / Intel / NVIDIA
      - Ιδανικό για μηχανήματα με ενοποιημένη μνήμη (π.χ. AMD Ryzen AI Max 395)
      - API συμβατό με OpenAI για Open WebUI, ChatGPT-Next-Web κ.ά.
      - Ενσωματωμένο web UI συνομιλίας με φόρτωση μοντέλων κατά την εκτέλεση

      **Ξεκινώντας:**
      1. Τοποθετήστε τα αρχεία μοντέλων GGUF στον τόμο μοντέλων (`/models`)
      2. Ανοίξτε το web UI στο `http://<zima-ip>:18080` και φορτώστε ένα μοντέλο
      3. Διατηρήστε το `/dev/dri` για επιτάχυνση Vulkan. αφαιρέστε το για λειτουργία μόνο CPU
    hu_HU: |-
      A llama.cpp egy tiszta C/C++ következtető motor GGUF nagy nyelvi modellekhez, a hivatalos OpenAI-kompatibilis szerverrel és beépített webes felülettel.

      **Főbb jellemzők:**
      - GGUF modellek (Llama, Qwen, DeepSeek, Gemma, Mistral és mások) futtatása CPU-n vagy GPU-n
      - A Vulkan háttér azonnal működik AMD / Intel / NVIDIA GPU-kon
      - Kiválóan alkalmas egységes memóriájú gépekhez (pl. AMD Ryzen AI Max 395)
      - OpenAI-kompatibilis API az Open WebUI, ChatGPT-Next-Web és mások számára
      - Beépített csevegő webes felület futás közbeni modellbetöltéssel

      **Első lépések:**
      1. Helyezze a GGUF modellfájlokat a modellkötetbe (`/models`)
      2. Nyissa meg a webes felületet itt: `http://<zima-ip>:18080`, és töltsön be egy modellt
      3. Tartsa meg a `/dev/dri` leképezést a Vulkan-gyorsításhoz; távolítsa el csak CPU-s módhoz
    ro_RO: |-
      llama.cpp este un motor de inferență pur C/C++ pentru modele lingvistice mari GGUF, cu serverul oficial compatibil OpenAI și o interfață web integrată.

      **Caracteristici cheie:**
      - Rulează modele GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral și altele) pe CPU sau GPU
      - Backend-ul Vulkan funcționează direct pe GPU-uri AMD / Intel / NVIDIA
      - Excelent pentru mașini cu memorie unificată (de ex. AMD Ryzen AI Max 395)
      - API compatibil OpenAI pentru Open WebUI, ChatGPT-Next-Web și altele
      - Interfață web de chat integrată cu încărcarea modelelor la runtime

      **Pentru început:**
      1. Puneți fișierele model GGUF în volumul de modele (`/models`)
      2. Deschideți interfața web la `http://<zima-ip>:18080` și încărcați un model
      3. Păstrați `/dev/dri` pentru accelerarea Vulkan; eliminați-l pentru modul doar CPU
    hr_HR: |-
      llama.cpp je čisti C/C++ mehanizam za zaključivanje velikih jezičnih modela GGUF, sa službenim poslužiteljem kompatibilnim s OpenAI i ugrađenim web sučeljem.

      **Ključne značajke:**
      - Pokrećite GGUF modele (Llama, Qwen, DeepSeek, Gemma, Mistral i druge) na CPU-u ili GPU-u
      - Vulkan pozadina radi odmah na AMD / Intel / NVIDIA GPU-ovima
      - Izvrsno za strojeve s unificiranom memorijom (npr. AMD Ryzen AI Max 395)
      - API kompatibilan s OpenAI za Open WebUI, ChatGPT-Next-Web i druge
      - Ugrađeno web sučelje za chat s učitavanjem modela tijekom rada

      **Početak rada:**
      1. Stavite GGUF datoteke modela u volumen modela (`/models`)
      2. Otvorite web sučelje na `http://<zima-ip>:18080` i učitajte model
      3. Zadržite `/dev/dri` za Vulkan ubrzanje; uklonite za način rada samo s CPU-om
    ca_ES: |-
      llama.cpp és un motor d'inferència en C/C++ pur per a grans models de llenguatge GGUF, amb el servidor oficial compatible amb OpenAI i una interfície web integrada.

      **Característiques clau:**
      - Executeu models GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral i més) a la CPU o la GPU
      - El backend Vulkan funciona directament a les GPU AMD / Intel / NVIDIA
      - Ideal per a equips amb memòria unificada (p. ex. AMD Ryzen AI Max 395)
      - API compatible amb OpenAI per a Open WebUI, ChatGPT-Next-Web i més
      - Interfície web de xat integrada amb càrrega de models en temps d'execució

      **Per començar:**
      1. Poseu els fitxers de model GGUF al volum de models (`/models`)
      2. Obriu la interfície web a `http://<zima-ip>:18080` i carregueu un model
      3. Manteniu `/dev/dri` per a l'acceleració Vulkan; traieu-lo per al mode només CPU
    ga_IE: |-
      Is inneall tátal comhardaí C/C++ íon é llama.cpp do mhúnlaí teanga móra GGUF, leis an bhfreastalaí oifigiúil atá comhoiriúnach le OpenAI agus comhéadan gréasáin ionsuite.

      **Príomhghnéithe:**
      - Rith samhlacha GGUF (Llama, Qwen, DeepSeek, Gemma, Mistral agus eile) ar LAP nó GPU
      - Oibríonn inneall Vulkan as an mbosca ar GPUanna AMD / Intel / NVIDIA
      - An-oiriúnach do mheaisíní a bhfuil cuimhne aontaithe acu (m.sh. AMD Ryzen AI Max 395)
      - API comhoiriúnach le OpenAI do Open WebUI, ChatGPT-Next-Web agus eile
      - Comhéadan gréasáin comhrá ionsuite le luchtú samhlacha le linn reatha

      **Chun tús a chur:**
      1. Cuir comhaid samhla GGUF sa toirt samhlacha (`/models`)
      2. Oscail an comhéadan gréasáin ag `http://<zima-ip>:18080` agus luchtaigh samhail
      3. Coinnigh `/dev/dri` do luasghéarú Vulkan; bain é le haghaidh mód LAP amháin
    ml_IN: |-
      GGUF വലിയ ഭാഷാ മോഡലുകൾക്കായുള്ള ഒരു ശുദ്ധ C/C++ ഇൻഫറൻസ് എഞ്ചിനാണ് llama.cpp; ഔദ്യോഗിക OpenAI-അനുയോജ്യ സെർവറും ബിൽറ്റ്-ഇൻ വെബ് UI-യും ഉൾപ്പെടുന്നു.

      **പ്രധാന സവിശേഷതകൾ:**
      - GGUF മോഡലുകൾ (Llama, Qwen, DeepSeek, Gemma, Mistral തുടങ്ങിയവ) CPU-യിലോ GPU-യിലോ പ്രവർത്തിപ്പിക്കുക
      - Vulkan ബാക്കെൻഡ് AMD / Intel / NVIDIA GPU-കളിൽ നേരിട്ട് പ്രവർത്തിക്കുന്നു
      - യൂണിഫൈഡ് മെമ്മറി ഉപകരണങ്ങൾക്ക് (ഉദാ: AMD Ryzen AI Max 395) മികച്ചത്
      - Open WebUI, ChatGPT-Next-Web തുടങ്ങിയവയ്ക്കായുള്ള OpenAI-അനുയോജ്യ API
      - റൺടൈം മോഡൽ ലോഡിംഗോടുകൂടിയ ബിൽറ്റ്-ഇൻ ചാറ്റ് വെബ് UI

      **ആരംഭിക്കാൻ:**
      1. GGUF മോഡൽ ഫയലുകൾ മോഡൽ വോള്യത്തിൽ (`/models`) ഇടുക
      2. `http://<zima-ip>:18080` എന്നതിൽ വെബ് UI തുറന്ന് ഒരു മോഡൽ ലോഡ് ചെയ്യുക
      3. Vulkan ആക്സിലറേഷനായി `/dev/dri` മാപ്പിംഗ് നിലനിർത്തുക; CPU-മാത്രം മോഡിനായി അത് നീക്കം ചെയ്യുക
