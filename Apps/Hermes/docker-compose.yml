    sv_SE: En självförbättrande AI-agent med minne, färdigheter, meddelanden och en webbpanel.
    el_GR: Ένας αυτοβελτιούμενος πράκτορας AI με μνήμη, δεξιότητες, μηνύματα και πίνακα ελέγχου web.
    hr_HR: Samopoboljšavajući AI agent s memorijom, vještinama, porukama i web nadzornom pločom.
    pt_PT: Um agente de IA autoaperfeiçoável com memória, competências, mensagens e painel web.
    ru_RU: Самообучающийся ИИ-агент с памятью, навыками, сообщениями и веб-панелью.
