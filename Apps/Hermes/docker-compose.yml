    - arm64
  main: hermes
  category: AI
  developer: Nous Research
  author: Nous Research
  tagline:
    en_US: A self-improving AI agent with memory, skills, messaging, and a web dashboard.
    en_GB: A self-improving AI agent with memory, skills, messaging, and a web dashboard.
    it_IT: Un agente AI auto-migliorante con memoria, competenze, messaggistica e dashboard web.
