name: hermes
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: hermes
    deploy:
      resources:
        reservations:
          memory: 1G
    restart: unless-stopped
    command:
      - gateway
      - run
    ports:
      - target: 8642
        published: "8642"
        protocol: tcp
      - target: 9119
        published: "9119"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/
        target: /opt/data
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: zimaos
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
    x-casaos:
      ports:
        - container: "8642"
          description:
            en_US: Gateway API Port
            en_GB: Gateway API Port
            it_IT: Porta API del gateway
            nb_NO: Gateway API-port
            zh_CN: 网关 API 端口
            ja_JP: ゲートウェイ API ポート
            ko_KR: 게이트웨이 API 포트
            fr_FR: Port API de la passerelle
            de_DE: Gateway-API-Port
            sv_SE: Gateway API-port
            el_GR: Θύρα API πύλης
            hr_HR: API priključak pristupnika
            pt_PT: Porta da API do gateway
            ru_RU: Порт API шлюза
            tr_TR: Ağ geçidi API bağlantı noktası
        - container: "9119"
          description:
            en_US: Dashboard HTTP Port
            en_GB: Dashboard HTTP Port
            it_IT: Porta HTTP della dashboard
            nb_NO: Dashboard HTTP-port
            zh_CN: 仪表盘 HTTP 端口
            ja_JP: ダッシュボード HTTP ポート
            ko_KR: 대시보드 HTTP 포트
            fr_FR: Port HTTP du tableau de bord
            de_DE: Dashboard-HTTP-Port
            sv_SE: Dashboard HTTP-port
            el_GR: Θύρα HTTP πίνακα ελέγχου
            hr_HR: HTTP priključak nadzorne ploče
            pt_PT: Porta HTTP do painel
            ru_RU: HTTP-порт панели управления
            tr_TR: Panel HTTP bağlantı noktası
      volumes:
        - container: /opt/data
          description:
            en_US: Hermes User Data Directory
            en_GB: Hermes User Data Directory
            it_IT: Directory Dati Utente Hermes
            nb_NO: Hermes brukerdata-katalog
            zh_CN: Hermes 用户数据目录
            ja_JP: Hermes ユーザーデータディレクトリ
            ko_KR: Hermes 사용자 데이터 디렉터리
            fr_FR: Répertoire des données utilisateur Hermes
            de_DE: Hermes Benutzerdatenverzeichnis
            sv_SE: Hermes användardata-katalog
            el_GR: Κατάλογος δεδομένων χρήστη Hermes
            hr_HR: Hermes direktorij korisničkih podataka
            pt_PT: Diretório de dados do utilizador Hermes
            ru_RU: Каталог пользовательских данных Hermes
            tr_TR: Hermes kullanıcı veri dizini
      envs:
        - container: HERMES_DASHBOARD
          description:
            en_US: Enables the Hermes web dashboard
            en_GB: Enables the Hermes web dashboard
            it_IT: Abilita la dashboard web di Hermes
            nb_NO: Aktiverer Hermes-nettdashbordet
            zh_CN: 启用 Hermes Web 仪表盘
            ja_JP: Hermes の Web ダッシュボードを有効にします
            ko_KR: Hermes 웹 대시보드를 활성화합니다
            fr_FR: Active le tableau de bord web de Hermes
            de_DE: Aktiviert das Hermes-Web-Dashboard
            sv_SE: Aktiverar Hermes webbpanel
            el_GR: Ενεργοποιεί τον πίνακα ελέγχου web του Hermes
            hr_HR: Omogućuje Hermes web nadzornu ploču
            pt_PT: Ativa o painel web do Hermes
            ru_RU: Включает веб-панель Hermes
            tr_TR: Hermes web panelini etkinleştirir
        - container: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          description:
            en_US: "Dashboard login username (default: zimaos)"
            en_GB: "Dashboard login username (default: zimaos)"
            it_IT: "Nome utente di accesso alla dashboard (predefinito: zimaos)"
            nb_NO: "Brukernavn for innlogging pa dashbordet (standard: zimaos)"
            zh_CN: "仪表盘登录用户名（默认：zimaos）"
            ja_JP: "ダッシュボードのログインユーザー名（デフォルト：zimaos）"
            ko_KR: "대시보드 로그인 사용자 이름(기본값: zimaos)"
            fr_FR: "Nom d'utilisateur de connexion au tableau de bord (par defaut : zimaos)"
            de_DE: "Benutzername fur die Dashboard-Anmeldung (Standard: zimaos)"
            sv_SE: "Anvandarnamn for inloggning pa webbpanelen (standard: zimaos)"
            el_GR: "Ονομα χρηστη συνδεσης στο dashboard (προεπιλογη: zimaos)"
            hr_HR: "Korisnicko ime za prijavu na nadzornu plocu (zadano: zimaos)"
            pt_PT: "Nome de utilizador para iniciar sessao no painel (predefinido: zimaos)"
            ru_RU: "Имя пользователя для входа в панель (по умолчанию: zimaos)"
            tr_TR: "Panel giris kullanici adi (varsayilan: zimaos)"
        - container: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          description:
            en_US: "Before starting Hermes, set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD to your own password in app settings. The default username is `zimaos`. The dashboard will not start with an empty password."
            en_GB: "Before starting Hermes, set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD to your own password in app settings. The default username is `zimaos`. The dashboard will not start with an empty password."
            it_IT: "Prima di avviare Hermes, imposta una password personale in HERMES_DASHBOARD_BASIC_AUTH_PASSWORD nelle impostazioni dell’app. Il nome utente predefinito è `zimaos`. La dashboard non si avvia con una password vuota."
            nb_NO: "Før du starter Hermes, sett HERMES_DASHBOARD_BASIC_AUTH_PASSWORD til ditt eget passord i appinnstillingene. Standardbrukernavnet er `zimaos`. Dashbordet starter ikke med et tomt passord."
            zh_CN: "启动 Hermes 前，请在应用设置中将 HERMES_DASHBOARD_BASIC_AUTH_PASSWORD 设为您自己的密码。默认用户名为 `zimaos`。密码为空时仪表盘无法启动。"
            ja_JP: "Hermes の起動前に、アプリ設定で HERMES_DASHBOARD_BASIC_AUTH_PASSWORD に自分のパスワードを設定してください。デフォルトのユーザー名は `zimaos` です。パスワードが空の場合、ダッシュボードは起動しません。"
            ko_KR: "Hermes를 시작하기 전에 앱 설정에서 HERMES_DASHBOARD_BASIC_AUTH_PASSWORD에 개인 비밀번호를 설정하세요. 기본 사용자 이름은 `zimaos`입니다. 비밀번호가 비어 있으면 대시보드가 시작되지 않습니다."
            fr_FR: "Avant de démarrer Hermes, définissez votre propre mot de passe pour HERMES_DASHBOARD_BASIC_AUTH_PASSWORD dans les paramètres de l’application. Le nom d’utilisateur par défaut est `zimaos`. Le tableau de bord ne démarre pas avec un mot de passe vide."
            de_DE: "Setzen Sie vor dem Start von Hermes in den App-Einstellungen Ihr eigenes Passwort für HERMES_DASHBOARD_BASIC_AUTH_PASSWORD. Der Standardbenutzername ist `zimaos`. Das Dashboard startet nicht mit einem leeren Passwort."
            sv_SE: "Innan du startar Hermes, ange ditt eget lösenord för HERMES_DASHBOARD_BASIC_AUTH_PASSWORD i appinställningarna. Standardanvändarnamnet är `zimaos`. Webbpanelen startar inte med ett tomt lösenord."
            el_GR: "Πριν ξεκινήσετε το Hermes, ορίστε δικό σας κωδικό στο HERMES_DASHBOARD_BASIC_AUTH_PASSWORD στις ρυθμίσεις εφαρμογής. Το προεπιλεγμένο όνομα χρήστη είναι `zimaos`. Ο πίνακας ελέγχου δεν ξεκινά με κενό κωδικό."
            hr_HR: "Prije pokretanja Hermesa postavite vlastitu lozinku za HERMES_DASHBOARD_BASIC_AUTH_PASSWORD u postavkama aplikacije. Zadano korisničko ime je `zimaos`. Nadzorna ploča ne pokreće se s praznom lozinkom."
            pt_PT: "Antes de iniciar o Hermes, defina a sua própria palavra-passe para HERMES_DASHBOARD_BASIC_AUTH_PASSWORD nas definições da aplicação. O nome de utilizador predefinido é `zimaos`. O painel não inicia com uma palavra-passe vazia."
            ru_RU: "Перед запуском Hermes задайте собственный пароль HERMES_DASHBOARD_BASIC_AUTH_PASSWORD в настройках приложения. Имя пользователя по умолчанию — `zimaos`. Панель не запускается с пустым паролем."
            tr_TR: "Hermes’i başlatmadan önce uygulama ayarlarında HERMES_DASHBOARD_BASIC_AUTH_PASSWORD için kendi parolanızı belirleyin. Varsayılan kullanıcı adı `zimaos`dur. Panel boş parola ile başlamaz."

