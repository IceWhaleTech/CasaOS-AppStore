  description:
    en_US: |
      Roon music software transforms your listening experience with rich metadata, discovery features, and audiophile sound. It works with streaming services and local files.

      Roon brings all your music together and adds bios, reviews, photos, lyrics, tour dates, and cross-linked credits for performers, songwriters, producers, engineers, and composers. Everything about music - browsing, discovery, collecting, and listening - is more engaging with Roon.

      RoonServer is the central server component. It runs on a Linux amd64/x86_64 host, stores the Roon database and settings, and serves your library to Roon Remote clients and audio endpoints on your local network. It is controlled from the Roon app and does not provide a browser-based WebUI.

    zh_CN: |
      Roon 音乐软件通过丰富的元数据、发现功能和发烧级音质改变您的聆听体验，同时支持流媒体服务和本地文件。

      Roon 将您的所有音乐集中在一起，并补充艺术家简介、评论、照片、歌词、巡演日期，以及演奏者、词曲作者、制作人、工程师和作曲家的交叉关联信息。音乐浏览、发现、收藏和聆听都因此更加精彩。

      RoonServer 是中央服务器组件，运行于 Linux amd64/x86_64 主机，保存 Roon 数据库和设置，并向局域网中的 Roon Remote 客户端和音频终端提供音乐库。它由 Roon 应用管理，不提供基于浏览器的 WebUI。

    en_GB: |
      Roon music software transforms your listening experience with rich metadata, discovery features, and audiophile sound. It works with streaming services and local files. RoonServer is the central server component for your library and is controlled from the Roon app; it does not provide a browser WebUI.
    de_DE: |
      Roon ist Musiksoftware mit umfangreichen Metadaten, Entdeckungsfunktionen und audiophiler Klangqualität. Sie funktioniert mit Streaming-Diensten und lokalen Dateien. RoonServer ist die zentrale Serverkomponente für Ihre Bibliothek und wird über die Roon-App gesteuert; eine browserbasierte WebUI gibt es nicht.
    es_ES: |
      Roon es un software musical con metadatos enriquecidos, funciones de descubrimiento y sonido para audiófilos. Funciona con servicios de streaming y archivos locales. RoonServer es el componente central de tu biblioteca y se controla desde la aplicación Roon; no ofrece WebUI.
    fr_FR: |
      Roon est un logiciel musical avec des métadonnées riches, des fonctions de découverte et un son audiophile. Il fonctionne avec les services de streaming et les fichiers locaux. RoonServer est le composant central de votre bibliothèque et se contrôle depuis l'application Roon ; il ne fournit pas de WebUI.
    ja_JP: |
      Roonは豊富なメタデータ、音楽発見機能、オーディオファイル向けの音質を備え、ストリーミングサービスとローカルファイルに対応します。RoonServerはライブラリの中央サーバーで、Roonアプリから操作し、ブラウザ用WebUIはありません。
    ko_KR: |
      Roon은 풍부한 메타데이터, 음악 발견 기능, 오디오파일 수준의 음질을 제공하며 스트리밍 서비스와 로컬 파일을 지원합니다. RoonServer는 라이브러리의 중앙 서버로 Roon 앱에서 제어하며 브라우저 WebUI는 제공하지 않습니다.
    zh_TW: |
      Roon 是一套具備豐富中繼資料、探索功能與發燒級音質的音樂軟體，支援串流服務與本機檔案。RoonServer 是音樂庫的中央伺服器，由 Roon 應用程式控制，不提供瀏覽器 WebUI。

