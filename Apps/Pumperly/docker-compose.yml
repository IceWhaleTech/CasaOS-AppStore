name: pumperly

services:
  pumperly:
    image: drumsergio/pumperly:1.19.1
    container_name: pumperly
    deploy:
      resources:
        reservations:
          memory: 512M
    restart: unless-stopped
    # Apply the database migrations of this release, then start the app; the
    # upstream compose file does the same with a one-shot `migrate` service.
    command: ["sh", "-c", "node migrate.mjs && exec node server.js"]
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      DATABASE_URL: postgresql://pumperly:changeme@pumperly-db:5432/pumperly
      PUMPERLY_DEFAULT_COUNTRY: ES
      TZ: $TZ
    networks:
      - pumperly-network
    depends_on:
      pumperly-db:
        condition: service_healthy
    x-casaos:
      envs:
        - container: DATABASE_URL
          description:
            en_US: PostGIS connection string. Its password must match POSTGRES_PASSWORD.
        - container: PUMPERLY_DEFAULT_COUNTRY
          description:
            en_US: "Country the map opens on, as an ISO code (e.g. ES, FR, DE, IT, GB)"
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Web UI Port
          protocol: tcp
      volumes: []

  pumperly-db:
    image: postgis/postgis:17-3.4
    container_name: pumperly-db
    deploy:
      resources:
        reservations:
          memory: 256M
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/pgdata
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: pumperly
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: pumperly
    networks:
      - pumperly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pumperly -d pumperly"]
      interval: 5s
      timeout: 5s
      retries: 5
    x-casaos:
      envs:
        - container: POSTGRES_USER
          description:
            en_US: PostgreSQL user
        - container: POSTGRES_PASSWORD
          description:
            en_US: PostgreSQL password, the same as the one in DATABASE_URL
        - container: POSTGRES_DB
          description:
            en_US: PostgreSQL database name
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_US: PostgreSQL data directory

networks:
  pumperly-network:
    name: pumperly-network

x-casaos:
  id: org.icewhale.pumperly
  architectures:
    - amd64
  main: pumperly
  author: GeiserX
  developer: GeiserX
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Pumperly/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Pumperly/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Pumperly/screenshot-2.png
  title:
    en_US: Pumperly
  tagline:
    en_US: Fuel and EV route planner with live prices from 22 countries
    zh_CN: 提供 22 个国家实时油价的燃油和电动车路线规划器
  description:
    en_US: |
      Pumperly is a map of fuel prices and EV chargers with a route planner on top. Pick a destination and it draws the route, lists every station along it with its price and the minutes a stop would add, and plans the cheapest places to fill up.

      Prices come from government and community sources in 22 countries with no API key to set, and from two more with a free key. EV chargers come from the official registries of Spain and Germany and from Open Charge Map elsewhere. Prices convert into 37 currencies, the interface speaks 17 languages, and it keeps no accounts, no analytics and no tracking cookies.

      This app runs Pumperly and its PostGIS database, which gives you the price map. Route planning and address search need Valhalla and Photon, which you can run separately.
    zh_CN: |
      Pumperly 是一张油价和电动车充电桩地图，上面叠加了路线规划器。选择目的地后，它会画出路线，列出沿途每个加油站的价格和停靠需要多花的分钟数，并规划最便宜的加油地点。

      价格来自 22 个国家的政府和社区数据源，无需设置 API 密钥，另有两个国家使用免费密钥。充电桩数据来自西班牙和德国的官方登记以及其他地区的 Open Charge Map。价格可换算为 37 种货币，界面支持 17 种语言，不需要账户，没有分析统计，也没有跟踪 Cookie。

      本应用运行 Pumperly 及其 PostGIS 数据库，提供价格地图。路线规划和地址搜索需要 Valhalla 和 Photon，可以另行部署。
  tips:
    before_install:
      en_US: |
        Before installing, replace the password `changeme` in both `DATABASE_URL` and `POSTGRES_PASSWORD` with the same new value.

        On first start Pumperly creates its database schema, then fills the map country by country over the next few minutes as its scrapers run.

        For route planning and address search, run Valhalla and Photon separately and add the `VALHALLA_URL` and `PHOTON_URL` environment variables. Without them, Pumperly still shows the stations and their prices on the map.

        Set `PUMPERLY_DEFAULT_COUNTRY` to your country code (e.g. FR, DE, IT, GB).
  index: /
  port_map: "3000"
  scheme: http
  version: "1.19.1"
  update_at: "2026-10-10"
  release_notes:
    en_US: |-
      - Updates Pumperly to 1.19.1 and PostGIS to 17-3.4, the versions its own compose file runs.
      - The app applies its database migrations on every start, as the upstream compose file does with its `migrate` service.
      - Lists amd64 only: the postgis/postgis image is built for amd64 only.
  website: https://pumperly.com
  repo: https://github.com/GeiserX/Pumperly
  support: https://github.com/GeiserX/Pumperly/issues
  docs: https://geiserx.github.io/Pumperly/
