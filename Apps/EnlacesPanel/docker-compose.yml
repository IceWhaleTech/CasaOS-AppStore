    es_ES: Primera versión en la tienda de CasaOS. EnlacesPanel 0.5.2, en español e inglés.
  website: https://github.com/pctecnikk/enlacespanel
  repo: https://github.com/pctecnikk/enlacespanel
  support: https://github.com/pctecnikk/enlacespanel/issues
