name: libredb-studio
services:
  libredb-studio:
    image: libredb/libredb-studio:0.18.2@sha256:88693f4522543af3d53042ec1e201c1d45dd7cb7224de0e8171bdd9649bdccda
    container_name: libredb-studio
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3016"
        protocol: tcp
    environment:
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: ""
      JWT_SECRET: ""
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/db/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    privileged: false
x-casaos:
  id: org.icewhale.libredbstudio
  main: libredb-studio
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.libredbstudio/assets/icon.svg
  title:
    en_US: LibreDB Studio
    zh_CN: LibreDB Studio
  index: /
  scheme: http
  port_map: "3016"
  version: "0.18.2"
