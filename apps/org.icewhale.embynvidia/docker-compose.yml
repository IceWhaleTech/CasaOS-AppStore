name: emby-nvidia
services:
  emby:
    devices:
      - /dev/dri:/dev/dri
      - /dev/vchiq:/dev/vchiq
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12
    environment:
      UID: "1000"
      GID: "100"
      GIDLIST: "100"
      TZ: $TZ
      NVIDIA_VISIBLE_DEVICES: all
    image: emby/embyserver:4.9.5.0
    runtime: nvidia
    deploy:
      resources:
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: bridge
    ports:
      - target: 8096
        published: "8096"
        protocol: tcp
      - target: 8920
        published: "8920"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/TV Shows
        target: /data/tvshows
      - type: bind
        source: /DATA/Media/Movies
        target: /data/movies
    container_name: emby
x-casaos:
  id: org.icewhale.embynvidia
  main: emby
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.embynvidia/assets/icon.svg
  title:
    en_US: Emby(Nvidia GPU)
  index: /
  port_map: "8096"
  version: "4.9.5"
