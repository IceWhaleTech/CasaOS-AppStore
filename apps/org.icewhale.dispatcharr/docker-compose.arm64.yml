name: dispatcharr
services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.29.0@sha256:e14417ccb262901708973884e0642c9360e82d6cb0732b7d3e6cf5a8498efebd
    deploy:
      resources:
        reservations:
          memory: 512M
    restart: unless-stopped
    ports:
      - 9191:9191
    volumes:
      - /DATA/AppData/$AppID/data:/data
    environment:
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    container_name: dispatcharr

x-casaos:
  id: org.icewhale.dispatcharr
  main: dispatcharr
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.dispatcharr/assets/icon.png
  title:
    en_US: Dispatcharr
  port_map: '9191'
  scheme: http
  version: "0.29.0"
