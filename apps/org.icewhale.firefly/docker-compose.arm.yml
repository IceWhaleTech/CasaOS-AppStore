version: "3"
name: firefly
services:
  firefly:
    image: "uusec/firefly:latest@sha256:31bf91225760115bbe3700b7828836b4bee0c671b73c0ab3d5739acd0aede3c9"
    container_name: firefly
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    volumes:
      - /lib/modules:/lib/modules
      - /DATA/AppData/firefly/conf:/firefly/conf
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    environment:
      #- TZ=Asia/Shanghai
      #- FIREFLY_DEVICE=eth0
      - FIREFLY_PASSWORD=firefly
      #- FIREFLY_AUTO_SSL=false
      #- FIREFLY_PORT=50121
    deploy:
      resources:
        reservations:
          memory: 32M

x-casaos:
  id: org.icewhale.firefly
  main: firefly
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.firefly/assets/icon.svg
  title:
    en_US: Firefly
    zh_CN: 萤火虫
  port_map: "50121"
  scheme: http
  index: /
  version: "0.0.1"
