name: deluge
services:
  deluge:
    environment:
      DELUGE_LOGLEVEL: error
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: linuxserver/deluge:2.2.0@sha256:f441c4aa640a63ee1eda2c60ae2629d088627cf7354da53ee9d7a7290be4e453
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
      - target: 8112
        published: "8112"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: udp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA
        target: /DATA
    container_name: deluge
x-casaos:
  id: org.icewhale.deluge
  main: deluge
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.deluge/assets/icon.svg
  title:
    en_US: Deluge
  index: /
  port_map: "8112"
  version: "2.2.0"
