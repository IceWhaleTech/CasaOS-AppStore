# 商店规范: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/main/docs/specs/compose-and-x-casaos.md
name: llamacpp
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:239a1ece7282b2ba9570418627ab4f5a840520f2e25dd40a08382bc7b97625e8
    container_name: llamacpp
    ports:
      - target: 8080
        published: '18080'
        protocol: tcp
    environment:
      - LLAMA_ARG_N_GPU_LAYERS=999
      - LLAMA_ARG_CONTEXT_SIZE=8192
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/models
        target: /models
        bind:
          create_host_path: true
    restart: unless-stopped
x-casaos:
  id: org.icewhale.llamacpp
  main: llamacpp
  index: /
  port_map: '18080'
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.llamacpp/assets/icon.svg
  title:
    ca_ES: llama.cpp
