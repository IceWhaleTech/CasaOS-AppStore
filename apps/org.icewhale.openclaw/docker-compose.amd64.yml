name: openclaw
services:
  openclaw-init:
    image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:66ed9d9bf9ecc02e2a2d5d4b7110b766ba535a64c802e9d20b0794ae062f82e5
    user: "0:0"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /home/node/.openclaw
      - type: bind
        source: /DATA/AppData/$AppID/auth-profile-secrets
        target: /home/node/.config/openclaw
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 1000:1000 /home/node/.openclaw /home/node/.config/openclaw
    restart: "no"
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:66ed9d9bf9ecc02e2a2d5d4b7110b766ba535a64c802e9d20b0794ae062f82e5
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: casaos
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    network_mode: bridge
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /home/node/.openclaw
      - type: bind
        source: /DATA/AppData/$AppID/auth-profile-secrets
        target: /home/node/.config/openclaw
    ports:
      - target: 18789
        published: "24190"
        protocol: tcp
      - target: 18790
        published: "18790"
        protocol: tcp
    init: true
    restart: unless-stopped
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --allow-unconfigured
      - --port
      - "18789"
x-casaos:
  id: org.icewhale.openclaw
  title:
    de_DE: OpenClaw
    el_GR: OpenClaw
    en_GB: OpenClaw
    en_US: OpenClaw
    fr_FR: OpenClaw
    hr_HR: OpenClaw
    it_IT: OpenClaw
    ja_JP: OpenClaw
    ko_KR: OpenClaw
    nb_NO: OpenClaw
    pt_PT: OpenClaw
    ru_RU: OpenClaw
    sv_SE: OpenClaw
    tr_TR: OpenClaw
    zh_CN: OpenClaw
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.openclaw/assets/icon.svg
  main: openclaw
  port_map: "24190"
  index: /#token=casaos
  scheme: http
  version: "2026.9.6"
