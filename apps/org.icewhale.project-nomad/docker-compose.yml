name: project-nomad
services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:1.35.1
    container_name: nomad_admin
    restart: unless-stopped
    networks:
      - default
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      URL: http://localhost:8080
      LOG_LEVEL: info
      APP_KEY: project-nomad-change-this-app-key
      NOMAD_STORAGE_PATH: /DATA/AppData/$AppID/storage
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: nomad
      DB_USER: nomad_user
      DB_PASSWORD: nomad_change_this_password
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DISABLE_COMPRESSION: "false"
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/storage
        target: /app/storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/api/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          memory: 512M
  mysql:
    image: mysql:8.0.45
    container_name: nomad_mysql
    restart: unless-stopped
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: nomad_change_this_root_password
      MYSQL_DATABASE: nomad
      MYSQL_USER: nomad_user
      MYSQL_PASSWORD: nomad_change_this_password
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mysql
        target: /var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: 512M

  redis:
    image: redis:7.4.8-alpine
    container_name: nomad_redis
    restart: unless-stopped
    networks:
      - default
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/redis
        target: /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          memory: 64M

  dozzle:
    image: amir20/dozzle:v10.0.7
    container_name: nomad_dozzle
    restart: unless-stopped
    networks:
      - default
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
    ports:
      - target: 8080
        published: "9999"
        protocol: tcp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

  disk-collector:
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    container_name: nomad_disk_collector
    restart: unless-stopped
    networks:
      - default
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /DATA/AppData/$AppID/storage
        target: /storage

# NOMAD attaches the optional tools it creates to this exact network name.
# Explicit service networks keep ZimaOS Compose imports from using network_mode: bridge.
networks:
  default:
    name: project-nomad_default
    driver: bridge

