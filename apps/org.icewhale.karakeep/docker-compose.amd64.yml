name: karakeep
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:3d57623bf031f32a0597a3ebe0cd869bff6ba181c02ebc90fac492458bcfd4a4
    container_name: karakeep
    deploy:
      resources:
        reservations:
          memory: 512M
    restart: unless-stopped
    ports:
      - target: 3000
        published: "14592"
        protocol: tcp
    networks:
      - karakeep
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    environment:
      MEILI_ADDR: "http://karakeep-meilisearch:7700"
      BROWSER_WEB_URL: "http://karakeep-chrome:9222"
      DATA_DIR: /data
      NEXTAUTH_URL: "http://localhost:14592"
      NEXTAUTH_SECRET: "change_this_to_a_long_random_string"
      MEILI_MASTER_KEY: "change_this_to_a_long_random_string"
      OPENAI_API_KEY: ""
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:7dd0edb7a82dd71a574a968e0361bf6e0ae850c4b291e14539e0f0000d810e36
    container_name: karakeep-chrome
    deploy:
      resources:
        reservations:
          memory: 512M
    restart: unless-stopped
    init: true
    networks:
      - karakeep
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.41.0@sha256:d84b081420b2e5899f5acc3745e1d6510950430fef3ee6b9df5e53b0bf3e19c9
    container_name: karakeep-meilisearch
    deploy:
      resources:
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - karakeep
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/meilisearch
        target: /meili_data
    environment:
      MEILI_MASTER_KEY: "change_this_to_a_long_random_string"
      MEILI_NO_ANALYTICS: "true"
networks:
  karakeep:
    driver: bridge
x-casaos:
  id: org.icewhale.karakeep
  main: karakeep
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.karakeep/assets/icon.svg
  scheme: http
  port_map: "14592"
  index: /
  title:
    en_US: Karakeep
  version: "0.33.2"
