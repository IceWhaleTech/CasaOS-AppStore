# Adapted from ../bbot/.github/workflows/app-lifecycle.yml.
# This adapter executes the predeployed trusted bbot plugin, not PR code.
name: Application Lifecycle Adapter

on:
  workflow_call:
    inputs:
      app-key:
        required: true
        type: string
      input-artifact:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  lifecycle:
    environment: zimaos-e2e
    runs-on: [self-hosted, linux, x64, zimaos-e2e]
    timeout-minutes: 75
    env:
      APP_KEY: ${{ inputs.app-key }}
      E2E_CLI: ${{ vars.E2E_CLI || '/opt/zimaos-e2e/current/e2e' }}
      E2E_PLUGIN: ${{ vars.E2E_LIFECYCLE_PLUGIN || '/opt/bbot/bbot-cli-install-1.2.0.wasm' }}
      E2E_ENV_FILE: ${{ vars.E2E_ENV_FILE || '/dev/null' }}
      E2E_NODES: ${{ vars.E2E_NODES || '/var/lib/zimaos-e2e/nodes.json' }}
      CASE_ID: CLI-LIFECYCLE-01
      E2E_CASE_TIMEOUT: 60m
    steps:
      - name: Allocate private directories
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_KEY" =~ ^app-[0-9a-f]{24}$ ]]
          umask 077
          root=$(mktemp -d "$RUNNER_TEMP/bbot-lifecycle.XXXXXXXX")
          mkdir "$root/input" "$root/evidence" "$root/plugins"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "BBOT_RUN_ROOT=$root" >> "$GITHUB_ENV"
          echo "E2E_ARTIFACTS=$root/evidence" >> "$GITHUB_ENV"
          echo "E2E_PLUGINS=$root/plugins" >> "$GITHUB_ENV"
          echo "E2E_RUN_ID=github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$APP_KEY" >> "$GITHUB_ENV"
      - name: Download Compose data
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.input-artifact }}
          path: ${{ steps.paths.outputs.root }}/input
      - name: Execute trusted bbot lifecycle suite
        shell: bash
        run: |
          set -euo pipefail
          test -x "$E2E_CLI"
          test -f "$E2E_PLUGIN"
          command -v jq >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['BBOT_RUN_ROOT']) / 'input'
          path = root / os.environ['APP_KEY'] / 'compose.yaml'
          if path.is_symlink() or path.parent.is_symlink() or not path.is_file():
              raise SystemExit('Expected a regular Compose file')
          if not 0 < path.stat().st_size <= 4 * 1024 * 1024:
              raise SystemExit('Invalid Compose size')
          PY
          export E2E_APP_COMPOSE_BASE64
          E2E_APP_COMPOSE_BASE64=$(base64 -w0 "$BBOT_RUN_ROOT/input/$APP_KEY/compose.yaml")
          "$E2E_CLI" plugin add "$E2E_PLUGIN"
          "$E2E_CLI" run -suite bbot-cli-install@1.2.0 -id "$CASE_ID" \
            -gate -lanes 1 -select node=pve -os-version 1.8.0-beta2 \
            -env "$E2E_ENV_FILE"
          jq -se --arg id "$CASE_ID" '
            map(select(.type == "case_end")) |
            length == 1 and .[0].case == $id and .[0].verdict == "PASS"
          ' "$E2E_ARTIFACTS/$E2E_RUN_ID/events.jsonl" >/dev/null
      - name: Upload lifecycle evidence
        if: ${{ always() && steps.paths.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: app-e2e-evidence-${{ github.run_attempt }}-${{ inputs.app-key }}
          path: ${{ steps.paths.outputs.root }}/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Clean private directories
        if: ${{ always() && steps.paths.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BBOT_RUN_ROOT" in "$RUNNER_TEMP"/bbot-lifecycle.*) ;; *) exit 2 ;; esac
          rm -rf -- "$BBOT_RUN_ROOT"
